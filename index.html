<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sudoku Dojo">
<meta name="theme-color" content="#F3F6FA" media="(prefers-color-scheme: light)" data-scheme="light">
<meta name="theme-color" content="#0F141C" media="(prefers-color-scheme: dark)" data-scheme="dark">
<title>Sudoku Dojo</title>
<style>
:root{
  --bg:#F3F6FA; --surface:#FFFFFF; --surface2:#EAEFF6; --ink:#1E2B45; --muted:#69768C; --pen:#2D5BD0; --pen-soft:#DCE6FB;
  --line:#C9D3E1; --line-thick:#1E2B45; --sel:#BBD3FA; --peer:#E4ECF7; --same:#C5D7F4; --err:#D63B3B; --err-soft:#FBE3E3;
  --hint:#FFE7A8; --hint-ink:#8A5A00; --ok:#2E8B57; --ok-soft:#DDF2E6; --star:#E3A21A; --shadow:0 1px 2px rgba(30,43,69,.08),0 8px 24px rgba(30,43,69,.08);
  --belt-easy:#E6EAF1; --belt-medium:#F2C230; --belt-hard:#3E9F68; --belt-expert:#2E6FD6; --belt-master:#7B4B2A; --belt-extreme:#15171C;
  --colA:#BFE3CB; --colB:#F6C9C9;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --cell: 40px;
  color-scheme: light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F141C; --surface:#171E29; --surface2:#202937; --ink:#E3E9F3; --muted:#8D99AD; --pen:#8AB0FF; --pen-soft:#22345A;
  --line:#2C3747; --line-thick:#8D9AB0; --sel:#2E4C80; --peer:#212D41; --same:#33497A; --err:#FF6B6B; --err-soft:#45222A;
  --hint:#5A4410; --hint-ink:#FFD777; --ok:#5BD08F; --ok-soft:#173A29; --star:#F2B83A; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  --belt-easy:#E6EAF1; --belt-extreme:#000000; --colA:#1F5136; --colB:#5A2A2A; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F141C; --surface:#171E29; --surface2:#202937; --ink:#E3E9F3; --muted:#8D99AD; --pen:#8AB0FF; --pen-soft:#22345A;
  --line:#2C3747; --line-thick:#8D9AB0; --sel:#2E4C80; --peer:#212D41; --same:#33497A; --err:#FF6B6B; --err-soft:#45222A;
  --hint:#5A4410; --hint-ink:#FFD777; --ok:#5BD08F; --ok-soft:#173A29; --star:#F2B83A; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.3);
  --belt-easy:#E6EAF1; --belt-extreme:#000000; --colA:#1F5136; --colB:#5A2A2A; color-scheme:dark;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:16px; line-height:1.45;
  -webkit-user-select:none; user-select:none; overscroll-behavior:none; -webkit-font-smoothing:antialiased}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:10; background:var(--bg)}
button{font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer}
button:focus-visible,.cell:focus-visible{outline:2px solid var(--pen); outline-offset:2px}
h1,h2,h3{font-family:var(--round); margin:0; letter-spacing:-.01em}
#app{max-width:520px; margin:0 auto; height:100%; position:relative; display:flex; flex-direction:column}
.screen{display:none; flex:1; min-height:0; flex-direction:column}
.screen.active{display:flex}
#s-game,#s-drill{position:relative}
.scroll{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:8px 18px 24px}

/* ---------- tab bar ---------- */
.tabbar{display:flex; border-top:1px solid var(--line); background:var(--surface); padding:6px 8px 4px}
.tabbar.hidden{display:none}
.tabbar button{flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; font-size:11px; color:var(--muted); padding:4px 0}
.tabbar button svg{width:24px; height:24px}
.tabbar button.on{color:var(--pen)}

/* ---------- home ---------- */
.home-top{display:flex; justify-content:space-between; align-items:center; padding:14px 18px 4px}
.brand{font-family:var(--round); font-weight:700; font-size:22px; display:flex; align-items:center; gap:10px}
.brand-mark{width:30px; height:30px; display:grid; grid-template-columns:repeat(3,1fr); gap:2px; padding:3px; border-radius:8px; background:var(--ink)}
.brand-mark i{border-radius:2px; background:var(--surface)} .brand-mark i:nth-child(5){background:var(--belt-medium)}
.hero{margin:18px 0 6px; padding:22px 20px; background:var(--surface); border-radius:22px; box-shadow:var(--shadow)}
.hero h1{font-size:30px; line-height:1.1; font-weight:700}
.hero p{margin:8px 0 18px; color:var(--muted); font-size:15px}
.btn{display:flex; align-items:center; justify-content:center; gap:8px; width:100%; height:52px; border-radius:26px; font-weight:600; font-size:17px; font-family:var(--round)}
.btn.primary{background:var(--pen); color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0F141C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0F141C}}
.btn.ghost{background:var(--pen-soft); color:var(--pen)}
.btn.line{border:1.5px solid var(--line); color:var(--ink)}
.btn + .btn{margin-top:10px}
.btn:active{transform:scale(.98)}
.card{background:var(--surface); border-radius:18px; padding:16px; box-shadow:var(--shadow); margin-top:14px}
.card h3{font-size:17px}
.row{display:flex; align-items:center; gap:12px}
.sub{color:var(--muted); font-size:14px}
.belt{width:30px; height:10px; border-radius:3px; background:var(--b); position:relative; flex:none; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.belt::after{content:""; position:absolute; right:7px; top:-2px; width:4px; height:14px; border-radius:1px; background:var(--b); box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.section-title{font-family:var(--round); font-size:20px; font-weight:700; margin:24px 0 2px}

/* ---------- level picker ---------- */
.levels{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px}
.lvl{display:flex; align-items:center; gap:10px; padding:14px 12px; border-radius:14px; background:var(--surface2); text-align:left; font-weight:600; font-family:var(--round)}
.lvl small{display:block; font-weight:400; font-family:var(--font); color:var(--muted); font-size:12px}
.lvl.on{box-shadow:inset 0 0 0 2px var(--pen); background:var(--pen-soft)}
.seg{display:flex; background:var(--surface2); border-radius:12px; padding:3px; margin-top:12px}
.seg button{flex:1; height:38px; border-radius:9px; font-weight:600; font-size:15px; color:var(--muted)}
.seg button.on{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(0,0,0,.12)}
.mode-note{font-size:13px; color:var(--muted); margin:8px 2px 0; min-height:38px}

/* ---------- game header ---------- */
.topbar{display:flex; align-items:center; height:48px; padding:0 8px}
.topbar .title{flex:1; text-align:center; font-family:var(--round); font-weight:700; font-size:17px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.iconbtn{width:44px; height:44px; display:grid; place-items:center; border-radius:22px; color:var(--ink)}
.iconbtn svg{width:24px; height:24px}
.iconbtn:active{background:var(--surface2)}
.infobar{display:flex; justify-content:space-between; align-items:center; padding:0 14px 6px; font-size:13px; color:var(--muted)}
.infobar b{color:var(--ink); font-weight:600}
.infobar .timer{display:flex; align-items:center; gap:6px; font-variant-numeric:tabular-nums}
.pausebtn{width:26px; height:26px; border-radius:13px; display:grid; place-items:center; background:var(--surface2)}
.pausebtn svg{width:12px; height:12px}
.chip{display:inline-flex; align-items:center; gap:6px; padding:2px 8px; border-radius:10px; background:var(--surface2); color:var(--ink); font-size:12px; font-weight:600}

/* ---------- board ---------- */
.boardwrap{display:flex; justify-content:center; padding:0 8px; position:relative}
.board{display:grid; grid-template-columns:repeat(9,var(--cell)); grid-template-rows:repeat(9,var(--cell));
  border:2px solid var(--line-thick); border-radius:4px; background:var(--surface); touch-action:manipulation; position:relative; overflow:hidden}
.cell{position:relative; display:grid; place-items:center; border-right:1px solid var(--line); border-bottom:1px solid var(--line);
  font-family:var(--round); font-size:calc(var(--cell)*.6); font-weight:500; color:var(--ink); cursor:pointer; transition:background-color .08s}
.cell.c8{border-right:0} .cell.r8{border-bottom:0}
.cell.c2,.cell.c5{border-right:2px solid var(--line-thick)} .cell.r2,.cell.r5{border-bottom:2px solid var(--line-thick)}
.cell.peer{background:var(--peer)} .cell.same{background:var(--same)} .cell.sel{background:var(--sel)}
.cell.ray{background:color-mix(in srgb,var(--hint) 22%,var(--surface))}
.cell.hunit{background:color-mix(in srgb,var(--hint) 45%,var(--surface))}
.cell.xcell{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--err) 30%,var(--surface)) 0 3px,var(--err-soft) 3px 7px)}
.cell.hcell{background:var(--hint)}
.cell.colA{background:var(--colA)} .cell.colB{background:var(--colB)}
.cell.user{color:var(--pen)} .cell.err{color:var(--err)} .cell.errbg{background:var(--err-soft)} .cell.okbg{background:var(--ok-soft)}
.cell.target{box-shadow:inset 0 0 0 3px var(--pen)}
.cell.target.pulse{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:inset 0 0 0 3px transparent}}
.cell.flash{animation:flash .45s}
@keyframes flash{0%,100%{background:inherit}30%{background:var(--err-soft)}}
.cell.pop .v{animation:pop .25s}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.cell .v{line-height:1}
.notes{position:absolute; inset:1px; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(3,1fr); pointer-events:none}
.notes span{display:grid; place-items:center; font-family:var(--font); font-size:calc(var(--cell)*.24); line-height:1; color:var(--muted); font-weight:500; border-radius:3px}
.notes span.hl{color:var(--ink); background:var(--same); font-weight:700}
.notes span.key{color:var(--hint-ink); font-weight:800}
.notes span.x{color:var(--err); text-decoration:line-through; font-weight:800}
.notes span.ok{color:var(--ok); font-weight:800}
.paused .board .cell{color:transparent !important}
.paused .board .notes{visibility:hidden}
.pauseveil{position:absolute; inset:0; display:none; place-items:center; z-index:2}
.paused .pauseveil{display:grid}
.pauseveil button{width:72px; height:72px; border-radius:36px; background:var(--pen); color:#fff; display:grid; place-items:center; box-shadow:var(--shadow)}
.pauseveil svg{width:30px; height:30px}

/* ---------- tools & pad ---------- */
.tools{display:flex; justify-content:space-around; padding:12px 12px 4px; margin-top:auto}
#s-game .boardwrap{margin-bottom:8px}
#d-pad{margin-top:auto}
#s-drill .coach{margin-top:auto; margin-bottom:12px}
#s-game .pad{padding-bottom:max(10px, 2vh)}
.tool{display:flex; flex-direction:column; align-items:center; gap:2px; font-size:12px; color:var(--muted); width:72px; position:relative}
.tool .ic{width:46px; height:46px; display:grid; place-items:center; border-radius:23px; background:var(--surface2); color:var(--ink)}
.tool .ic svg{width:22px; height:22px}
.tool:active .ic{transform:scale(.94)}
.tool .badge{position:absolute; top:-2px; right:8px; min-width:22px; height:18px; padding:0 5px; border-radius:9px; font-size:10px; font-weight:700; display:grid; place-items:center; background:var(--muted); color:var(--surface)}
.tool.on .badge{background:var(--pen)} .tool.on .ic{background:var(--pen-soft); color:var(--pen)}
.tool:disabled{opacity:.35}
.pad{display:grid; grid-template-columns:repeat(9,1fr); gap:2px; padding:6px 8px 10px}
.pad button{height:62px; font-family:var(--round); font-size:34px; font-weight:400; color:var(--pen); border-radius:10px; position:relative}
.pad button:active{background:var(--pen-soft)}
.pad button.gone{visibility:hidden}
.pad.notesmode button{color:var(--muted); font-size:28px}
.pad button.on{background:var(--pen); color:#fff}
:root[data-theme="dark"] .pad button.on{color:#0F141C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .pad button.on{color:#0F141C}}
.pad button .cnt{position:absolute; bottom:4px; left:0; right:0; font-size:10px; color:var(--muted); font-family:var(--font)}

/* ---------- coach / feedback panel ---------- */
.coach.float{position:absolute; left:12px; right:12px; bottom:calc(env(safe-area-inset-bottom,0px) + 12px); margin:0; z-index:5; box-shadow:0 6px 30px rgba(10,16,28,.25)}
.coach{margin:10px 12px 0; background:var(--surface); border-radius:16px; padding:12px 14px; box-shadow:var(--shadow); display:none}
.coach.show{display:block}
.coach h4{margin:0 0 4px; font-family:var(--round); font-size:16px; display:flex; align-items:center; gap:8px}
.coach p{margin:0; font-size:14px; line-height:1.45}
.coach .actions{display:flex; gap:8px; margin-top:10px}
.coach .actions .btn{height:42px; font-size:15px; margin:0}
.coach.good h4{color:var(--ok)} .coach.bad h4{color:var(--err)}
.dot{width:10px; height:10px; border-radius:5px; display:inline-block; background:var(--hint)}

/* ---------- drill ---------- */
.prompt{margin:0 14px 8px; display:flex; align-items:center; gap:10px; font-size:14px; min-height:40px}
.prompt .big{font-family:var(--round); font-size:28px; font-weight:700; color:var(--pen); width:44px; height:44px; display:grid; place-items:center; border-radius:12px; background:var(--pen-soft)}
.progress{height:4px; background:var(--surface2); border-radius:2px; margin:0 14px 10px; overflow:hidden}
.progress i{display:block; height:100%; background:var(--pen); width:0; transition:width .3s}
.drill-list{margin-top:6px}
.drill{display:flex; align-items:center; gap:14px; width:100%; text-align:left; padding:14px 4px; border-bottom:1px solid var(--line)}
.drill:last-child{border-bottom:0}
.drill .ico{width:42px; height:42px; border-radius:12px; flex:none; display:grid; place-items:center; background:var(--surface2); font-family:var(--round); font-weight:700; color:var(--pen)}
.drill .ico svg{width:22px;height:22px}
.drill .meta{flex:1; min-width:0}
.drill .meta b{display:block; font-family:var(--round); font-size:16px}
.drill .meta span{font-size:13px; color:var(--muted); display:block}
.stars{display:flex; gap:1px; color:var(--line); flex:none}
.stars svg{width:15px; height:15px}
.stars .on{color:var(--star)}
.beltbar{display:flex; gap:6px; overflow-x:auto; padding:4px 0 2px; scrollbar-width:none}
.beltbar::-webkit-scrollbar{display:none}
.beltbar button{flex:none; display:flex; align-items:center; gap:8px; height:40px; padding:0 14px; border-radius:20px; background:var(--surface2); font-weight:600; font-size:14px; color:var(--muted); font-family:var(--round)}
.beltbar button.on{background:var(--ink); color:var(--bg)}
.beltpanel{margin-top:12px; padding:18px; border-radius:20px; background:var(--surface); box-shadow:var(--shadow); position:relative; overflow:hidden}
.beltpanel h2{font-size:24px}
.beltpanel .stripe{position:absolute; right:-30px; top:22px; width:180px; height:22px; transform:rotate(-8deg); background:var(--b); box-shadow:inset 0 0 0 1px rgba(0,0,0,.1)}
.beltpanel .stripe::after{content:""; position:absolute; left:40px; top:-6px; width:12px; height:34px; background:var(--b); box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.bar{height:6px; border-radius:3px; background:var(--surface2); margin-top:12px; overflow:hidden}
.bar i{display:block; height:100%; background:var(--star)}

/* ---------- sheet ---------- */
.veil{position:fixed; inset:0; background:rgba(10,16,28,.42); z-index:50; display:none; align-items:flex-end; justify-content:center}
.veil.show{display:flex}
.sheet{width:100%; max-width:520px; max-height:90%; overflow-y:auto; background:var(--surface); border-radius:22px 22px 0 0; padding:10px 20px calc(20px + env(safe-area-inset-bottom,0px)); animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px); opacity:.4}}
.sheet .grab{width:38px; height:5px; border-radius:3px; background:var(--line); margin:0 auto 12px}
.sheet h2{font-size:22px; margin-bottom:4px}
.sheet p{margin:6px 0; font-size:15px}
.sheet .btn{margin-top:14px}
.sheet .btn + .btn{margin-top:10px}
.bigstars{display:flex; justify-content:center; gap:6px; margin:14px 0 4px; color:var(--line)}
.bigstars svg{width:40px; height:40px}
.bigstars .on{color:var(--star)}
.statgrid{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:14px 0}
.stat{background:var(--surface2); border-radius:12px; padding:10px; text-align:center}
.stat b{display:block; font-family:var(--round); font-size:20px; font-variant-numeric:tabular-nums}
.stat span{font-size:12px; color:var(--muted)}
.stall{display:flex; gap:12px; padding:12px 0; border-top:1px solid var(--line)}
.stall .mini{flex:none}
.stall p{margin:0; font-size:14px}
.stall .when{font-family:var(--round); font-weight:700}
.mini{display:grid; grid-template-columns:repeat(9,9px); grid-template-rows:repeat(9,9px); border:1.5px solid var(--line-thick); background:var(--surface)}
.mini i{border-right:.5px solid var(--line); border-bottom:.5px solid var(--line)}
.mini i.f{background:color-mix(in srgb,var(--ink) 18%,var(--surface))} .mini i.t{background:var(--hint-ink)}
.mini i.c2,.mini i.c5{border-right:1px solid var(--line-thick)} .mini i.r2,.mini i.r5{border-bottom:1px solid var(--line-thick)}
.linkbtn{color:var(--pen); font-weight:600; font-size:14px; margin-top:4px}
.input{width:100%; height:48px; border-radius:12px; border:1.5px solid var(--line); background:var(--surface2); color:var(--ink); font:inherit; font-family:var(--round); font-size:18px; padding:0 14px; text-transform:uppercase; letter-spacing:.06em; -webkit-user-select:text; user-select:text}
.toggle{display:flex; align-items:center; justify-content:space-between; padding:14px 0; border-bottom:1px solid var(--line); gap:12px}
.toggle:last-child{border-bottom:0}
.toggle span small{display:block; color:var(--muted); font-size:13px}
.sw{width:50px; height:30px; border-radius:15px; background:var(--line); position:relative; flex:none; transition:background .15s}
.sw::after{content:""; position:absolute; top:3px; left:3px; width:24px; height:24px; border-radius:12px; background:#fff; transition:transform .15s; box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--ok)} .sw.on::after{transform:translateX(20px)}
.table{width:100%; border-collapse:collapse; font-size:14px; font-variant-numeric:tabular-nums}
.table th{font-weight:600; color:var(--muted); text-align:right; padding:6px 4px; font-size:12px}
.table th:first-child,.table td:first-child{text-align:left}
.table td{padding:10px 4px; border-top:1px solid var(--line); text-align:right}
.table td:first-child{display:flex; align-items:center; gap:8px; font-weight:600}
.toast{position:fixed; left:50%; top:calc(env(safe-area-inset-top,0px) + 12px); transform:translate(-50%,-80px); background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:20px; font-size:14px; font-weight:600; z-index:80; transition:transform .25s; max-width:90%; text-align:center}
.toast.show{transform:translate(-50%,0)}
.loading{position:fixed; inset:0; z-index:70; display:none; place-items:center; background:color-mix(in srgb,var(--bg) 70%,transparent)}
.loading.show{display:grid}
.loading .box{background:var(--surface); padding:20px 26px; border-radius:18px; box-shadow:var(--shadow); text-align:center; font-weight:600; font-size:15px}
.spinner{width:34px; height:34px; margin:0 auto 10px; display:grid; grid-template-columns:repeat(3,1fr); gap:3px}
.spinner i{border-radius:3px; background:var(--pen); animation:blink 0.9s infinite}
.spinner i:nth-child(2n){animation-delay:.15s} .spinner i:nth-child(3n){animation-delay:.3s}
@keyframes blink{50%{opacity:.2}}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.small{font-size:13px; color:var(--muted)}
.learn{background:var(--surface2); border-radius:14px; padding:12px 14px; margin-top:12px; font-size:14px}
.heat{display:grid; grid-template-rows:repeat(7,1fr); grid-auto-flow:column; gap:3px; margin-top:12px}
.heat i{aspect-ratio:1; border-radius:3px; background:var(--surface2)}
.heat i.fut{background:transparent}
.h1{background:color-mix(in srgb,var(--pen) 28%,var(--surface2)) !important}
.h2{background:color-mix(in srgb,var(--pen) 52%,var(--surface2)) !important}
.h3{background:color-mix(in srgb,var(--pen) 76%,var(--surface2)) !important}
.h4{background:var(--pen) !important}
.heat-legend{display:flex; justify-content:space-between; align-items:center; margin-top:8px; font-size:12px; color:var(--muted)}
.sw-row{display:flex; align-items:center; gap:3px}
.sw-row i{width:10px; height:10px; border-radius:2px; background:var(--surface2); display:inline-block}
.trend{width:100%; height:auto; display:block; margin-top:12px; overflow:visible}
.legend{display:flex; gap:14px; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-top:6px}
.legend span{display:flex; align-items:center; gap:5px}
.legend i{width:14px; height:3px; border-radius:2px; display:inline-block}
.legend i.dash{background:repeating-linear-gradient(90deg,var(--ok) 0 4px,transparent 4px 7px)}
.weak{display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--line)}
.weak:last-child{border-bottom:0}
.weak b{display:block; font-family:var(--round); font-size:15px}
.weak .small{display:block}
.weak .btn{width:auto; height:36px; padding:0 16px; font-size:14px; margin:0; flex:none}
.install{position:relative; border:1.5px solid var(--pen-soft)}
.install .x{position:absolute; top:4px; right:4px; font-size:22px; color:var(--muted)}
.install h3{padding-right:36px}
.coach.lesson{max-height:42vh; overflow-y:auto}
.coach.lesson p{font-size:15px}
.lessonrow .ico{color:var(--ok)}
.done{width:26px; height:26px; border-radius:13px; background:var(--ok-soft); color:var(--ok); display:grid; place-items:center; flex:none}
.done svg{width:14px; height:14px}
.complist{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px}
.complist .chip{height:30px; padding:0 10px; font-size:13px}
.complist .chip svg{width:13px; height:13px}
.focus{border:1.5px solid var(--pen-soft)}
.card.focus.compact{padding:6px 4px 6px 14px; margin:2px 0 12px}
.focus.compact.open{padding-bottom:14px}
.focus-head{display:flex; align-items:center; gap:2px}
.focus-toggle{flex:1; min-width:0; display:flex; align-items:center; gap:10px; min-height:40px; text-align:left}
.focus-tag{font-size:11px; font-weight:700; letter-spacing:.05em; color:var(--pen); flex:none}
.focus-toggle b{flex:1; min-width:0; font-family:var(--round); font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.chev{width:18px; height:18px; flex:none; color:var(--muted); transition:transform .2s}
.focus.open .chev{transform:rotate(180deg)}
.focus-body{display:none; padding-right:10px}
.focus.open .focus-body{display:block}
.focus.compact .x{width:40px; height:40px; font-size:22px; color:var(--muted); flex:none}
.btn.mini-btn{width:auto; height:36px; padding:0 18px; font-size:14px; margin:0}
@media (prefers-reduced-motion: reduce){*{animation:none !important; transition:none !important}}
@media (max-height:700px){ .pad button{height:52px; font-size:30px} .tools{padding-top:8px} .tool .ic{width:42px;height:42px} }

for (let c = 0; c < 9; c++) { const u = []; for (let r = 0; r < 9; r++) u.push(r * 9 + c); UNITS.push(u); }

}
const POP = new Uint8Array(512); for (let m = 1; m < 512; m++) POP[m] = POP[m >> 1] + (m & 1);
const LOW = new Int8Array(512); for (let m = 1; m < 512; m++) { let d = 1; while (!(m & (1 << (d - 1)))) d++; LOW[m] = d; }
const BIT = d => 1 << (d - 1);
const digitsOf = m => { const a = []; for (let d = 1; d <= 9; d++) if (m & (1 << (d - 1))) a.push(d); return a; };
const sees = (a, b) => a !== b && PEERSET[a].has(b);
const cellName = i => `R${ROW[i] + 1}C${COL[i] + 1}`;

/* =====================================================================
   1) THE MODEL
   var x[i,j,c] binary                                   (729 binaries)
   Original_Data              x[i,j,grid[i,j]] = 1

   Row_Constraint             sum_i x[i,j,c] = 1          (81)
   Column_Constraint          sum_j x[i,j,c] = 1          (81)

   exactly 4 of the 324 equality rows. Instead of calling Gurobi, the app solves
   it with the two things a MIP solver does on this model:
     • presolve / bound propagation: a row with one free binary fixes it to 1,
       and fixing a binary to 1 fixes every other binary in its 4 rows to 0
     • branch-and-bound: branch on the row with the fewest free binaries

   the cut  sum_{(i,j,c): S1=1} x[i,j,c] <= 80 ; infeasible  <=>  unique.

   ===================================================================== */
function modelSolve(grid, opts) {

    if ((R[ROW[i]] | C[COL[i]] | B[BOX[i]]) & b) return { count: 0, solution: null, nodes: 0 };

        if (n === 1) { const b = m; g[i] = LOW[m]; R[ROW[i]] |= b; C[COL[i]] |= b; B[BOX[i]] |= b; continue outer; }

const solveModel = (grid, rng) => modelSolve(grid, { limit: 1, rng }).solution;
const isUnique = grid => modelSolve(grid, { limit: 2 }).count === 1;
/* feasibility of a filled grid against the model's constraints (used for "Check") */

  return true;
}

/* =====================================================================
   2) LOGIC SOLVER  (human techniques)
   ===================================================================== */
function makeState(grid) {

}

  const out = [];

/* ---- subsets ---- */

/* ---------------- board component (shared by game & drills) ---------------- */
function makeBoard(el, onTap) {
  el.innerHTML = '';
  const cells = [];
  for (let i = 0; i < 81; i++) {
    const c = document.createElement('div');
    const base = `cell c${E.COL[i]} r${E.ROW[i]}`;
    c.className = base; c.dataset.i = i;
    c.innerHTML = '<span class="v"></span><div class="notes">' + '<span></span>'.repeat(9) + '</div>';
    el.appendChild(c);
    cells.push({ el: c, base, v: c.firstChild, n: [...c.lastChild.children], key: '' });
  }
  el.addEventListener('pointerdown', e => {
    const c = e.target.closest('.cell'); if (!c) return;
    e.preventDefault(); onTap(+c.dataset.i);
  });
  return {
    cells,
    render(spec) {
      for (let i = 0; i < 81; i++) {
        const s = spec[i], C = cells[i];
        const key = `${s.cls}|${s.v}|${s.notes}|${s.nhl}|${s.nkey}|${s.nx}|${s.nok}`;
        if (key === C.key) continue;
        C.key = key;
        C.el.className = C.base + (s.cls ? ' ' + s.cls : '');
        C.v.textContent = s.v ? s.v : '';
        for (let d = 1; d <= 9; d++) {
          const b = 1 << (d - 1), sp = C.n[d - 1];
          sp.textContent = (s.notes & b) ? d : '';
          sp.className = !(s.notes & b) ? '' : (s.nx & b) ? 'x' : (s.nok & b) ? 'ok' : (s.nkey & b) ? 'key' : (s.nhl & b) ? 'hl' : '';
        }
      }
    },
    flash(i) { const c = cells[i].el; c.classList.remove('flash'); void c.offsetWidth; c.classList.add('flash'); },
    pop(i) { const c = cells[i].el; c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop'); },
  };
}
const blankSpec = () => Array.from({ length: 81 }, () => ({ cls: '', v: 0, notes: 0, nhl: 0, nkey: 0, nx: 0, nok: 0 }));

function makePad(el, onDigit) {

/* ---------------- daily puzzle ---------------- */
const DAILY_LEVEL = ['extreme', 'medium', 'hard', 'expert', 'hard', 'expert', 'master']; // Sun..Sat
function todayKey(d) { d = d || new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
function dailyInfo() {
  const d = new Date(), key = todayKey(d);
  const seed = (Math.imul(d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(), 2654435761) >>> 0);
  return { key, seed, level: DAILY_LEVEL[d.getDay()] };
}
function dailyStreak() {
  let n = 0; const d = new Date();
  if (!DB.daily[todayKey(d)]) d.setDate(d.getDate() - 1);
  while (DB.daily[todayKey(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}

/* ---------------- puzzle codes (share a puzzle without storing it) ---------------- */
const makeCode = (level, seed) => CODE_PFX[level] + '-' + (seed >>> 0).toString(36).toUpperCase();
function parseCode(code) {
  const m = String(code).trim().toUpperCase().match(/^([A-Z]{3})-?([0-9A-Z]{1,7})$/);
  if (!m) return null;
  const level = Object.keys(CODE_PFX).find(k => CODE_PFX[k] === m[1]);
  const seed = parseInt(m[2], 36);
  if (!level || !(seed >= 0) || seed > 4294967295) return null;
  return { level, seed };
}

function suggestDrill() {
  if (DB.tip && DRILL_BY_ID[DB.tip]) return { d: DRILL_BY_ID[DB.tip], why: 'Picked from your last solve' };
  const lv = S.trainLevel || 'easy';
  const d = DRILLS[lv].find(x => !drillBest(x.id) || drillBest(x.id).stars < 3);
  return d ? { d, why: `Next up in ${LVL[lv].name} training` } : null;
}

function bestLine(d, b) {
  if (!b) return 'Not tried yet.';
  if (d.kind === 'sprint') return `Best: ${b.score} digits.`;
  if (d.kind === 'run') return `Best: ${fmt(b.score * 1000)}.`;
  return `Best: ${b.score.toFixed(1)} s per ${d.kind === 'hatch' ? 'round' : d.kind === 'cands' ? 'cell' : 'position'}.`;
}
function parLine(d) {
  const [a, b] = d.par;
  if (d.kind === 'sprint') return `Gold at ${a} digits, silver at ${b}.`;
  if (d.kind === 'run') return `Gold under ${fmt(a * 1000)}, silver under ${fmt(b * 1000)}.`;
  return `Gold under ${a} s on average, silver under ${b} s.`;
}
