    ${items.map(([k, t, s]) => `<div class="toggle" data-k="${k}"><span>${t}${s ? `<small>${s}</small>` : ''}</span><span class="sw ${S[k] ? 'on' : ''}"></span></div>`).join('')}
    <div style="margin-top:14px" class="sub">Appearance</div>
    <div class="seg" id="st-theme">${['system', 'light', 'dark'].map(t => `<button data-t="${t}" class="${S.theme === t ? 'on' : ''}">${t[0].toUpperCase() + t.slice(1)}</button>`).join('')}</div>
    <button class="btn line" id="st-done">Done</button>`, () => { if (current === 'game') renderGame(); });
  el.onclick = e => {
    const tg = e.target.closest('.toggle');
    if (tg) { const k = tg.dataset.k; S[k] = !S[k]; $('.sw', tg).classList.toggle('on', S[k]); save(); }
    const th = e.target.closest('[data-t]');
    if (th) { S.theme = th.dataset.t; $$('#st-theme button', el).forEach(b => b.classList.toggle('on', b === th)); applyTheme(); save(); }
  };
  $('#st-done', el).onclick = closeSheet;
}
$('#btn-settings').onclick = settingsSheet;

/* =====================================================================
   GAME
   ===================================================================== */
let G = null;
const gBoard = makeBoard($('#g-board'), i => gameTap(i));
makePad($('#g-pad'), d => gameInput(d));

async function startGame(o) {
  loading(true, 'Generating puzzle');
  await tick();
  const r = await E.generateAsync(o.level, o.seed >>> 0);
  loading(false);
  G = {
    level: o.level, mode: o.mode, seed: o.seed >>> 0, code: makeCode(o.level, o.seed), daily: o.daily || null, drill: o.drill || null,
    puzzle: r.puzzle.slice(), sol: r.solution.slice(), vals: r.puzzle.slice(), notes: new Array(81).fill(0),
    sel: -1, notesMode: false, elapsed: 0, hist: [], undo: [], mistakes: 0, hints: 0, revealed: false, unranked: false, done: false, paused: false,
  };
  const key = o.level + '|' + o.mode; DB.stats[key] = DB.stats[key] || { played: 0, solved: 0, best: 0, total: 0 }; DB.stats[key].played++;
  openGame();
}
function resumeGame() { if (!DB.game) return; G = DB.game; G.paused = false; G.hl = null; openGame(); }
function openGame() {
  go('game');
  $('#g-title').textContent = G.drill ? DRILL_BY_ID[G.drill].title : G.daily ? 'Today\u2019s puzzle' : 'Sudoku Dojo';
  $('#g-level').innerHTML = `<span class="belt" style="display:inline-block;vertical-align:1px;margin-right:12px;${beltVar(G.level)}"></span><b>${LVL[G.level].name}</b>`;
  hideCoach();
  G._last = now();
  renderGame(); persistGame();
}
function persistGame() {
  if (!G || G.done) return;
  const { hl, _last, ...rest } = G;
  DB.game = rest; save();
}

/* timer: one global clock; time only runs while the game is visible and not paused */
setInterval(() => {
  const t = now();
  if (G && current === 'game' && !G.paused && !G.done && !document.hidden) { G.elapsed += t - (G._last || t); $('#g-time').textContent = fmt(G.elapsed); }
  if (G) G._last = t;
  if (D && current === 'drill') drillClock();
}, 250);
setInterval(() => { if (G && current === 'game' && !G.done) persistGame(); }, 5000);
document.addEventListener('visibilitychange', () => { if (document.hidden && G && current === 'game' && !G.done) { G.paused = true; renderGame(); persistGame(); } });

function setPaused(p) { if (!G || G.done) return; G.paused = p; renderGame(); }
$('#g-pause').onclick = () => setPaused(!G.paused);
$('#g-resume').onclick = () => setPaused(false);
$('#g-back').onclick = () => { persistGame(); go('play'); };

function gameTap(i) {
  if (!G || G.done) return;
  if (G.paused) return setPaused(false);
  G.sel = i; renderGame();
}

function conflicts() {
  const bad = new Set();
  for (const u of E.UNITS) {
    const seen = {};
    for (const i of u) { const v = G.vals[i]; if (!v) continue; if (seen[v] !== undefined) { bad.add(i); bad.add(seen[v]); } else seen[v] = i; }
  }
  return bad;
}

function renderGame() {
  if (!G) return;
  $('#s-game').classList.toggle('paused', !!G.paused);
  $('#g-time').textContent = fmt(G.elapsed);
  $('#g-mid').innerHTML = G.mode === 'classic' ? `Mistakes <b>${G.mistakes}/3</b>` : `<span class="chip">Paper</span>`;
  const spec = blankSpec(), sel = G.sel, sv = sel >= 0 ? G.vals[sel] : 0;
  const conf = (G.mode === 'paper' && S.conflicts) ? conflicts() : null;
  const hl = G.hl;
  for (let i = 0; i < 81; i++) {
    const s = spec[i], v = G.vals[i], given = G.puzzle[i] > 0, cls = [];
    s.v = v;
    if (v && !given) cls.push('user');
    if (sel >= 0) {
      if (S.hlPeers && i !== sel && E.PEERSET[sel].has(i)) cls.push('peer');
      if (S.hlSame && sv && v === sv && i !== sel) cls.push('same');
      if (i === sel) cls.push('sel');
    }
    if (hl) { if (hl.cells.has(i)) cls.push('hcell'); else if (hl.units.has(i)) cls.push('hunit'); }
    if (v && !given && ((G.mode === 'classic' || G.revealed) && v !== G.sol[i])) cls.push('err');
    if (conf && conf.has(i) && !given) cls.push('err');
    s.cls = cls.join(' ');
    if (!v) { s.notes = G.notes[i]; if (S.hlSame && sv) s.nhl = E.BIT(sv); }
  }
  gBoard.render(spec);
  // keypad
  const count = new Array(10).fill(0); for (const v of G.vals) count[v]++;
  $$('#g-pad button').forEach(b => {
    const d = +b.dataset.d;
    b.classList.toggle('gone', count[d] >= 9);
    $('.cnt', b).textContent = S.counts ? 9 - count[d] : '';
  });
  $('#g-pad').classList.toggle('notesmode', G.notesMode);
  $('#t-notes').classList.toggle('on', G.notesMode);
  $('#t-notes-badge').textContent = G.notesMode ? 'ON' : 'OFF';
  $('#t-hint-badge').style.display = G.hints ? '' : 'none';
  $('#t-hint-badge').textContent = G.hints;
}

function gameInput(d) {
  if (!G || G.done || G.paused) return;
  const i = G.sel;
  if (i < 0) { toast('Select a cell first'); return; }
  if (G.puzzle[i]) return;
  if (G.mode === 'classic' && G.vals[i] && G.vals[i] === G.sol[i]) return; // correct digits lock in classic
  G.hl = null; hideCoach();
  if (G.notesMode) {
    if (G.vals[i]) return;
    G.undo.push({ i, v: G.vals[i], n: G.notes[i], removed: [] });
    G.notes[i] ^= E.BIT(d);
    G.hist.push({ t: Math.round(G.elapsed), i, n: 1 });
  } else {
    if (G.vals[i] === d) return;
    const entry = { i, v: G.vals[i], n: G.notes[i], removed: [] };
    G.vals[i] = d; G.notes[i] = 0;
    if (S.autoNotes) for (const p of E.PEERS[i]) if (G.notes[p] & E.BIT(d)) { G.notes[p] &= ~E.BIT(d); entry.removed.push(p); }
    entry.d = d;
    G.undo.push(entry);
    G.hist.push({ t: Math.round(G.elapsed), i, d });
    gBoard.pop(i);
    if (G.mode === 'classic' && d !== G.sol[i]) {
      G.mistakes++; gBoard.flash(i);
      if (G.mistakes >= 3 && !G.unranked) { renderGame(); persistGame(); return threeStrikes(); }
    }
  }
  renderGame(); persistGame();
  if (!G.notesMode) checkComplete();
}

function eraseCell() {
  if (!G || G.done || G.paused) return;
  const i = G.sel; if (i < 0 || G.puzzle[i]) return;
  if (G.mode === 'classic' && G.vals[i] === G.sol[i]) return;
  if (!G.vals[i] && !G.notes[i]) return;
  G.undo.push({ i, v: G.vals[i], n: G.notes[i], removed: [] });
  if (G.vals[i]) G.hist.push({ t: Math.round(G.elapsed), i, d: 0 });
  G.vals[i] = 0; G.notes[i] = 0; G.hl = null;
  renderGame(); persistGame();
}
function undo() {
  if (!G || G.done || G.paused) return;
  const u = G.undo.pop(); if (!u) return;
  if (G.vals[u.i] !== u.v) G.hist.push({ t: Math.round(G.elapsed), i: u.i, d: u.v });
  G.vals[u.i] = u.v; G.notes[u.i] = u.n;
  if (u.d) for (const p of u.removed) G.notes[p] |= E.BIT(u.d);
  G.sel = u.i; G.hl = null;
  renderGame(); persistGame();
}
$('#t-undo').onclick = undo;
$('#t-erase').onclick = eraseCell;
$('#t-notes').onclick = () => { if (!G) return; G.notesMode = !G.notesMode; renderGame(); };
$('#t-hint').onclick = () => gameHint();

document.addEventListener('keydown', e => {
  if ($('#veil').classList.contains('show')) return;
  if (current === 'game' && G) {
    if (e.key >= '1' && e.key <= '9') return gameInput(+e.key);
    if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') return eraseCell();
    if (e.key === 'n' || e.key === 'N') { G.notesMode = !G.notesMode; return renderGame(); }
    if ((e.metaKey || e.ctrlKey) && e.key === 'z') { e.preventDefault(); return undo(); }
    const mv = { ArrowUp: -9, ArrowDown: 9, ArrowLeft: -1, ArrowRight: 1 }[e.key];
    if (mv) { e.preventDefault(); G.sel = G.sel < 0 ? 40 : (G.sel + mv + 81) % 81; renderGame(); }
  } else if (current === 'drill' && D) {
    if (e.key >= '1' && e.key <= '9') return drillDigit(+e.key);
    const mv = { ArrowUp: -9, ArrowDown: 9, ArrowLeft: -1, ArrowRight: 1 }[e.key];
    if (mv) { e.preventDefault(); D.sel = D.sel < 0 ? 40 : (D.sel + mv + 81) % 81; renderDrill(); }
  }
});

/* ---------- hints: explain the next logical step instead of just filling a cell ---------- */
function showCoach(el, html, cls) { el.className = 'coach show ' + (cls || ''); el.innerHTML = html; }
function hideCoach() { $('#g-coach').className = 'coach'; }

function gameHint() {
  if (!G || G.done || G.paused) return;
  const wrong = [];
  for (let i = 0; i < 81; i++) if (G.vals[i] && G.vals[i] !== G.sol[i]) wrong.push(i);
  G.hints++; G.unranked = true;
  if (wrong.length) {
    showCoach($('#g-coach'), `<h4><span class="dot"></span>Something doesn\u2019t fit</h4>
      <p>${wrong.length === 1 ? 'One digit on the board is wrong' : wrong.length + ' digits on the board are wrong'}, so the logic can\u2019t continue from here.</p>
      <div class="actions"><button class="btn ghost" id="hc-close">Keep looking</button><button class="btn primary" id="hc-show">Show ${wrong.length === 1 ? 'it' : 'them'}</button></div>`, 'float');
    $('#hc-close').onclick = () => hideCoach();
    $('#hc-show').onclick = () => { G.revealed = true; G.sel = wrong[0]; hideCoach(); renderGame(); };
    renderGame(); persistGame(); return;
  }
  const st = E.makeState(G.vals), steps = [];
  for (let k = 0; k < 40; k++) { const s = E.nextStep(st, 4); if (!s) break; steps.push(s); E.applyStep(st, s); if (s.p) break; }
  const place = steps.length && steps[steps.length - 1].p ? steps[steps.length - 1] : null;
  if (!steps.length) {
    showCoach($('#g-coach'), `<h4><span class="dot"></span>No standard technique applies</h4><p>This position needs trial and error. The solver can still place a correct digit for you.</p>
      <div class="actions"><button class="btn ghost" id="hc-close">Close</button><button class="btn primary" id="hc-place">Place one</button></div>`, 'float');
    $('#hc-close').onclick = hideCoach;
    $('#hc-place').onclick = () => { const i = G.vals.findIndex(v => !v); G.sel = i; hideCoach(); gameInput(G.sol[i]); };
    return;
  }
  const first = steps[0], T = E.TECH[first.t];
  G.hl = { cells: new Set(first.hl.cells), units: new Set((first.hl.units || []).flatMap(u => E.UNITS[u])) };
  const chain = steps.length > 1 ? `<p style="margin-top:6px" class="small">${steps.length > 2 ? `After ${steps.length - 2} more step${steps.length > 3 ? 's' : ''}, that` : 'That'} unlocks a digit: ${esc(E.describe(place))}</p>` : '';
  showCoach($('#g-coach'), `<h4><span class="dot"></span>${esc(T.name)}</h4><p>${esc(E.describe(first))}</p>${chain}
    ${LESSONS[first.t] ? `<button class="linkbtn" id="hc-learn" style="margin-top:8px">${lessonDone(first.t) ? 'Review' : 'Learn'} the ${esc(T.name)} lesson</button>` : ''}
    <div class="actions"><button class="btn ghost" id="hc-close">Got it</button>${place ? `<button class="btn primary" id="hc-place">Place ${place.p[1]} in ${E.cellName(place.p[0])}</button>` : ''}</div>`, 'float');
  $('#hc-close').onclick = () => { hideCoach(); };
  if ($('#hc-learn')) $('#hc-learn').onclick = () => { G.hl = null; hideCoach(); G.paused = true; persistGame(); startLesson(first.t, 'game'); };
  if (place) $('#hc-place').onclick = () => { G.sel = place.p[0]; G.hl = null; hideCoach(); const nm = G.notesMode; G.notesMode = false; gameInput(place.p[1]); if (G) G.notesMode = nm; renderGame(); };
  renderGame(); persistGame();
}

/* ---------- game menu ---------- */
$('#g-menu').onclick = () => {
  if (!G) return;
  const el = sheet(`
    <h2>${LVL[G.level].name}, ${G.mode === 'paper' ? 'paper mode' : 'classic'}</h2>
    <p class="sub">Puzzle code. Anyone who enters it gets this exact grid.</p>
    <div class="row" style="margin-top:8px"><input class="input" readonly value="${G.code}" style="flex:1"><button class="btn ghost" id="gm-copy" style="width:auto;padding:0 18px;margin:0">Copy</button></div>
    <button class="btn line" id="gm-restart">Restart this puzzle</button>
    <button class="btn line" id="gm-settings">Settings</button>
    <button class="btn line" id="gm-new">New game</button>`);
  $('#gm-copy', el).onclick = () => { try { navigator.clipboard.writeText(G.code).then(() => toast('Code copied'), () => toast(G.code)); } catch (e) { toast(G.code); } };
  $('#gm-restart', el).onclick = () => {
    Object.assign(G, { vals: G.puzzle.slice(), notes: new Array(81).fill(0), hist: [], undo: [], mistakes: 0, elapsed: 0, revealed: false, sel: -1, hl: null, unranked: G.hints > 0 });
    closeSheet(); hideCoach(); renderGame(); persistGame();
  };
  $('#gm-settings', el).onclick = () => { closeSheet(); settingsSheet(); };
  $('#gm-new', el).onclick = () => { closeSheet(); newGameSheet(); };
};

function threeStrikes() {
  const el = sheet(`<h2>Three mistakes</h2><p>In classic mode the game ends here. You can keep going, but this solve won\u2019t count towards your best times.</p>
    <button class="btn primary" id="ts-go">Keep going</button><button class="btn line" id="ts-new">New game</button>`);
  $('#ts-go', el).onclick = () => { G.unranked = true; closeSheet(); persistGame(); };
  $('#ts-new', el).onclick = () => { DB.game = null; save(); closeSheet(); newGameSheet(); };
}

function checkComplete() {
  if (G.vals.some(v => !v)) return;
  if (E.satisfiesModel(G.vals)) return winGame();
  if (G.mode !== 'paper') return;
  const wrong = G.vals.reduce((a, v, i) => a + (v !== G.sol[i] ? 1 : 0), 0);
  const el = sheet(`<h2>Not solved yet</h2>
    <p>The grid is full, but ${wrong === 1 ? '1 cell is' : wrong + ' cells are'} wrong. The clock is still running.</p>
    <button class="btn primary" id="cc-keep">Keep solving</button>
    <button class="btn line" id="cc-show">Show mistakes</button>`);
  $('#cc-keep', el).onclick = closeSheet;
  $('#cc-show', el).onclick = () => { G.revealed = true; G.unranked = true; closeSheet(); renderGame(); persistGame(); };
}

function winGame() {
  G.done = true; G.sel = -1; G.hl = null; hideCoach(); renderGame();
  const t = G.elapsed, key = G.level + '|' + G.mode;
  const st = DB.stats[key] = DB.stats[key] || { played: 1, solved: 0, best: 0, total: 0 };
  const clean = !G.unranked && !G.revealed && !G.hints;
  st.solved++; st.total += t;
  const newBest = clean && (!st.best || t < st.best);
  if (newBest) st.best = t;
  if (G.daily && !DB.daily[G.daily]) DB.daily[G.daily] = { time: t };
  let stars = 0;
  if (G.drill) {
    const d = DRILL_BY_ID[G.drill], s = t / 1000;
    stars = !clean ? 1 : s <= d.par[0] ? 3 : s <= d.par[1] ? 2 : 1;
    recordDrill(d, stars, s, (a, b) => a < b);
  }
  const an = analyse(G);
  DB.log.push({ ts: Date.now(), l: G.level, m: G.mode, t: Math.round(t), c: clean ? 1 : 0, h: G.hints,
    w: an.stalls.map(s => s.kind), dr: G.drill || undefined });
  if (G.drill) DB.dlog.push({ ts: Date.now(), id: G.drill, s: t / 1000, st: stars });
  trimLogs();
  DB.tip = an.tip || DB.tip;
  DB.game = null; save();
  const g = G;
  setTimeout(() => winSheet(g, an, { newBest, stars, clean }), 350);
}

/* ---------- post-game coaching: where did the time go? ---------- */
function analyse(g) {
  const first = new Map();
  for (const h of g.hist) if (h.d && h.d === g.sol[h.i] && !first.has(h.i)) first.set(h.i, h.t);
  const seq = [...first.entries()].filter(([i]) => !g.puzzle[i]).sort((a, b) => a[1] - b[1]);
  const gaps = []; let prev = 0;
  seq.forEach(([i, t], k) => { gaps.push({ gap: t - prev, start: prev, k, cell: i }); prev = t; });
  const sorted = gaps.map(x => x.gap).sort((a, b) => a - b), median = sorted.length ? sorted[sorted.length >> 1] : 0;
  const stalls = gaps.filter(x => x.gap >= 15000 && x.gap >= 2.5 * median).sort((a, b) => b.gap - a.gap).slice(0, 3);
  const kinds = {};
  for (const s of stalls) {
    // the correct digits placed so far
    const grid = g.puzzle.slice();
    for (let k = 0; k < s.k; k++) grid[seq[k][0]] = g.sol[seq[k][0]];
    s.grid = grid;
    // what the player's board actually looked like, and what they did during the pause
    // replay the pause: count note edits, and time spent with a wrong digit on the board
    const vals = g.puzzle.slice(), end = s.start + s.gap, isWrong = () => vals.some((v, i) => v && !g.puzzle[i] && v !== g.sol[i]);
    let notes = 0, wrongMs = 0, tPrev = s.start, wrongNow = false, began = false;
    for (const h of g.hist) {
      if (h.t > end) break;
      if (h.t > s.start) {
        if (!began) { wrongNow = isWrong(); began = true; }
        if (wrongNow) wrongMs += h.t - tPrev;
        tPrev = h.t;
        if (h.n) notes++;
      }
      if (h.d !== undefined) { vals[h.i] = h.d; if (h.t > s.start) wrongNow = isWrong(); }
    }
    if (!began) wrongNow = isWrong();
    if (wrongNow) wrongMs += end - tPrev;
    s.wrong = wrongMs >= 0.4 * s.gap;
    s.notes = notes;
    const st = E.makeState(grid), by = singlesByType(st);
    s.singles = SINGLE_IDS.reduce((a, id) => a + by[id].length, 0);
    s.easiest = SINGLE_IDS.find(id => by[id].length) || null;
    const chain = [];
    for (let k = 0; k < 40; k++) { const x = E.nextStep(st, 4); if (!x) break; chain.push(x); E.applyStep(st, x); if (x.p) break; }
    s.chain = chain;
    s.target = s.easiest ? by[s.easiest][0].p[0] : chain.length && chain[chain.length - 1].p ? chain[chain.length - 1].p[0] : s.cell;
    if (!s.singles && chain.length) s.tech = chain.reduce((a, x) => E.TECH[x.t].tier > E.TECH[a.t].tier ? x : a, chain[0]).t;
    s.kind = s.wrong ? 'mistake'
      : s.notes >= 8 ? 'notes'
      : s.singles ? (s.easiest === 'fullHouse' || s.easiest === 'hiddenSingleBox' ? 'scan' : s.easiest)
      : s.tech || 'trial';
    kinds[s.kind] = (kinds[s.kind] || 0) + 1;
  }
  const top = Object.keys(kinds).sort((a, b) => kinds[b] - kinds[a]).find(k => weakDrill(k));
  return { stalls, median, tip: top ? weakDrill(top) : null, placements: seq.length };
}

function miniHTML(grid, target) {
  let h = '<div class="mini">';
  for (let i = 0; i < 81; i++) h += `<i class="c${E.COL[i]} r${E.ROW[i]} ${i === target ? 't' : grid[i] ? 'f' : ''}"></i>`;
  return h + '</div>';
}

function winSheet(g, an, o) {
  const st = DB.stats[g.level + '|' + g.mode];
  const stallHTML = an.stalls.length ? an.stalls.map(s => {
    const k = s.kind || (s.singles ? 'scan' : s.tech || 'trial');
    const msg = k === 'mistake' ? 'A wrong digit was already on the board here, so nothing else could add up. Worth double-checking a digit before you commit it.'
      : k === 'notes' ? `You were writing notes (${s.notes} edits). That\u2019s real work, not being stuck, but fast, accurate notes save minutes.`
      : k === 'scan' ? `${s.singles === 1 ? 'An easy single was' : s.singles + ' singles were'} available, including a Full House or a single inside a box. Scanning was the hold-up.`
      : k === 'hiddenSingleLine' ? 'The only easy move was a <b>Hidden Single in a row or column</b>. Those are harder to see than singles in a box.'
      : k === 'nakedSingle' ? 'The only move was a <b>Naked Single</b>: a cell with one possible digit. You find those by counting a cell\u2019s row, column and box, not by scanning.'
      : k === 'trial' ? 'This spot needed trial and error, beyond the techniques the app teaches.'
      : `Nothing easier was left: the way forward was a <b>${esc(E.TECH[k].name)}</b>.`;
    return `<div class="stall">${miniHTML(s.grid, s.target)}<div><p><span class="when">${fmt(s.gap)}</span> <span class="small">stuck from ${fmt(s.start)}</span></p><p style="margin-top:4px">${msg}</p>${focusButtons(k)}</div></div>`;
  }).join('') : `<p class="sub">No long pauses. Your pace stayed close to ${secs(an.median)} per digit all the way through.</p>`;
  const el = sheet(`
    <h2>${o.newBest ? 'New best time' : 'Solved'}</h2>
    <div class="row" style="margin-top:2px">${beltHTML(g.level)}<span class="sub">${LVL[g.level].name}, ${g.mode === 'paper' ? 'paper mode' : 'classic'}${o.clean ? '' : ', assisted'}</span></div>
    ${g.drill ? starsHTML(o.stars, 'bigstars') : ''}
    <div class="statgrid">
      <div class="stat"><b>${fmt(g.elapsed)}</b><span>Time</span></div>
      <div class="stat"><b>${st && st.best ? fmt(st.best) : '\u2013'}</b><span>Best</span></div>
      <div class="stat"><b>${an.median ? secs(an.median) : '\u2013'}</b><span>Per digit</span></div>
    </div>
    <h3 style="font-size:17px;margin-top:4px">Where the time went</h3>
    ${stallHTML}
    ${g.drill ? `<button class="btn primary" id="ws-again">Run it again</button>` : `<button class="btn primary" id="ws-new">New game</button>`}
    <button class="btn line" id="ws-home">${g.drill ? 'Back to training' : 'Home'}</button>`, () => { G = null; });
  el.onclick = e => {
    const b = e.target.closest('[data-drill]'), l = e.target.closest('[data-lesson]');
    if (b) { const id = b.dataset.drill; closeSheet(); S.trainLevel = DRILL_BY_ID[id].lv; save(); go('train'); openDrillIntro(id); }
    if (l) { closeSheet(); startLesson(l.dataset.lesson); }
  };
  if (g.drill) $('#ws-again', el).onclick = () => { closeSheet(); startDrill(g.drill); };
  else $('#ws-new', el).onclick = () => { closeSheet(); newGameSheet(); };
  $('#ws-home', el).onclick = () => { closeSheet(); go(g.drill ? 'train' : 'play'); };
}

function recordDrill(d, stars, score, better) {
  const b = DB.drills[d.id];
  if (!b) DB.drills[d.id] = { stars, score, runs: 1 };
  else { b.runs++; b.stars = Math.max(b.stars, stars); if (better(score, b.score)) b.score = score; }
  if (DB.tip === d.id && stars === 3) DB.tip = null;
  save();
}

/* =====================================================================
   TRAINING DRILLS
   ===================================================================== */
let D = null;
const dBoard = makeBoard($('#d-board'), i => drillTap(i));
makePad($('#d-pad'), d => drillDigit(d));
$('#d-back').onclick = () => { if (D) D.alive = false; D = null; go('train'); };

/* ---------- position builders (all generated on the spot) ---------- */
const SINGLE_IDS = ['fullHouse', 'hiddenSingleBox', 'hiddenSingleLine', 'nakedSingle'];
function singlesByType(st) {
  const key = s => s.p[0] * 10 + s.p[1];
  const raw = {}; for (const id of SINGLE_IDS) raw[id] = E.TECH[id].find(st, 200);
  const seen = new Set(), out = {};
  for (const id of SINGLE_IDS) {           // each move is filed under the easiest way to see it
    out[id] = [];
    for (const s of raw[id]) { const k = key(s); if (seen.has(k)) continue; out[id].push(s); }
    for (const s of out[id]) seen.add(key(s));
  }
  return out;
}
function allSinglesList(st) { const b = singlesByType(st); return SINGLE_IDS.flatMap(id => b[id]); }
function filledCount(g) { let n = 0; for (let i = 0; i < 81; i++) if (g[i]) n++; return n; }

/* walk a puzzle forward with random singles, calling visit(state) at each step */
function walkSingles(puzzle, rng, visit) {
  const st = E.makeState(puzzle);
  for (let k = 0; k < 81 && !E.solvedState(st); k++) {
    if (visit(st) === false) return;
    const all = allSinglesList(st); if (!all.length) return;
    const s = all[(rng() * all.length) | 0]; E.placeIn(st, s.p[0], s.p[1]);
  }
}

async function buildFindSingles(def, rng) {
  for (let a = 0; a < 25; a++) {
    const P = E.generate(def.src, (rng() * 4294967296) >>> 0), pool = [];
    walkSingles(P.puzzle, rng, st => {
      const f = filledCount(st.g);
      if (f > 72) return false;
      const by = singlesByType(st), targets = def.techs.flatMap(t => by[t]);
      if (targets.length) pool.push({ g: Int8Array.from(st.g), targets, n: targets.length, f });
    });
    if (pool.length) {
      pool.sort((x, y) => x.n - y.n || Math.abs(50 - x.f) - Math.abs(50 - y.f));
      const pick = pool[(rng() * Math.min(4, pool.length)) | 0];
      return { g: Array.from(pick.g), sol: P.solution, targets: pick.targets, notes: null };
    }
    await tick();
  }
  return null;
}

async function buildFindElim(def, rng) {
  const tierMin = Math.min(...def.techs.map(t => E.TECH[t].tier));
  for (let a = 0; a < 40; a++) {
    const P = E.generate(def.src, (rng() * 4294967296) >>> 0), pool = [];
    const st = E.makeState(P.puzzle);
    for (let k = 0; k < 400 && !E.solvedState(st); k++) {
      const ns = E.nextStep(st, 4); if (!ns) break;
      if (E.TECH[ns.t].tier >= tierMin) {
        const ans = def.techs.flatMap(t => E.allSteps(st, t, 30));
        if (ans.length) pool.push({ g: Array.from(st.g), c: Array.from(st.c), ans });
      }
      E.applyStep(st, ns);
    }
    if (pool.length) { const pick = pool[(rng() * pool.length) | 0]; return { g: pick.g, notes: pick.c, sol: P.solution, ans: pick.ans }; }
    await tick();
  }
  return null;
}

async function buildHatch(def, rng) {
  for (let a = 0; a < 25; a++) {
    const P = E.generate(def.src, (rng() * 4294967296) >>> 0);
    let res = null;
    const stopAt = 30 + ((rng() * 18) | 0);
    walkSingles(P.puzzle, rng, st => {
      if (filledCount(st.g) < stopAt) return;
      const by = {}; for (const s of allSinglesList(st)) (by[s.p[1]] = by[s.p[1]] || new Set()).add(s.p[0]);
      const ds = Object.keys(by).map(Number).filter(d => by[d].size >= 1 && by[d].size <= 4);
      if (!ds.length) return;
      ds.sort((x, y) => by[y].size - by[x].size);
      const d = ds[(rng() * Math.min(3, ds.length)) | 0];
      res = { g: Array.from(st.g), sol: P.solution, d };
      return false;
    });
    if (res) return res;
    await tick();
  }
  return null;
}
function hatchTargets(g, d) {
  const st = E.makeState(g), set = new Set();
  for (const s of allSinglesList(st)) if (s.p[1] === d) set.add(s.p[0]);
  return set;
}

async function buildCands(def, rng) {
  for (let a = 0; a < 25; a++) {
    const P = E.generate(def.src, (rng() * 4294967296) >>> 0);
    let res = null;
    const stopAt = filledCount(P.puzzle) + ((rng() * 10) | 0);
    walkSingles(P.puzzle, rng, st => {
      if (filledCount(st.g) < stopAt) return;
      const opts = [];
      for (let i = 0; i < 81; i++) if (!st.g[i] && E.POP[st.c[i]] >= 2 && E.POP[st.c[i]] <= 5) opts.push(i);
      if (!opts.length) return;
      opts.sort((x, y) => E.POP[st.c[y]] - E.POP[st.c[x]]);
      const cell = opts[(rng() * Math.min(8, opts.length)) | 0];
      res = { g: Array.from(st.g), sol: P.solution, cell, truth: st.c[cell] };
      return false;
    });
    if (res) return res;
    await tick();
  }
  return null;
}

async function buildSprint(def, rng) {
  const P = E.generate(def.src, (rng() * 4294967296) >>> 0);
  return { g: P.puzzle.slice(), sol: P.solution, given: P.puzzle.slice() };
}

function buildPosition(D) {
  const def = D.def;
  if (def.kind === 'find') return def.notes ? buildFindElim(def, D.rng) : buildFindSingles(def, D.rng);
  if (def.kind === 'hatch') return buildHatch(def, D.rng);
  if (def.kind === 'cands') return buildCands(def, D.rng);
  if (def.kind === 'sprint') return buildSprint(def, D.rng);
}

/* ---------- drill flow ---------- */
async function startDrill(id) {
  const def = DRILL_BY_ID[id];
  if (def.kind === 'run') return startGame({ level: def.level, mode: 'paper', seed: randSeed(), drill: def.id });
  D = { def, rng: E.mulberry32(randSeed()), k: 0, total: def.n || def.rounds || 0, times: [], errors: 0, score: 0, sel: -1, phase: 'load', alive: true, placed: new Set(), toggles: 0, next: null };
  if (def.kind === 'sprint') { D.timeLeft = def.seconds * 1000; D.total = 0; }
  go('drill');
  $('#d-title').textContent = def.title;
  hideDrillCoach();
  $('#d-prog').style.width = '0%';
  $('#d-prompt').innerHTML = '';
  dBoard.render(blankSpec());
  await loadNext(true);
}

async function loadNext(first) {
  const me = D; if (!me || !me.alive) return;
  me.phase = 'load';
  let pos;
  const slow = setTimeout(() => loading(true, first ? 'Building positions' : 'Building the next position'), 150);
  if (me.next) { pos = await me.next; me.next = null; }
  else { await tick(); pos = await buildPosition(me); }
  clearTimeout(slow); loading(false);
  if (!me.alive || D !== me) return;
  if (!pos) { toast('Couldn\u2019t build a position. Try again.'); go('train'); return; }
  me.pos = pos; me._lt = now(); me.hints = null; me.hintIdx = 0; me.sel = -1; me.placed = new Set(); me.phase = 'answer'; me.posStart = now(); me.show = null; me.toggles = 0; me.tries = 0;
  if (me.def.kind === 'hatch') me.targets = hatchTargets(pos.g, pos.d);
  hideDrillCoach();
  renderDrill();
  // build the following position in the background while this one is being solved
  const more = me.def.kind === 'sprint' || me.k + 1 < me.total;
  if (more) me.next = (async () => { await new Promise(r => setTimeout(r, 400)); return buildPosition(me); })();
}

function drillClock() {
  const el = $('#d-clock');
  if (!D || D.phase === 'load') return;
  if (D.lesson) { el.textContent = ''; return; }
  if (D.def.kind === 'sprint') {
    if (D.phase === 'answer' && !document.hidden) { const t = now(); D.timeLeft -= t - (D._lt || t); D._lt = t; } else D._lt = now();
    el.textContent = Math.max(0, Math.ceil(D.timeLeft / 1000));
    if (D.timeLeft <= 0 && D.phase === 'answer') { D.phase = 'done'; finishDrill(); }
  } else if (D.phase === 'answer') el.textContent = Math.floor((now() - D.posStart) / 1000) + 's';
}

function prompt() {
  const def = D.def, p = D.pos;
  if (def.kind === 'find') {
    const names = def.techs.length > 2 ? 'the move' : def.techs.map(t => 'a ' + E.TECH[t].name).join(' or ');
    return `<span style="flex:1">${def.notes ? `Find ${esc(names)}. Tap a cell, then the candidate it removes.` : `Find ${esc(names)}. Tap the cell, then its digit.`}</span><button class="linkbtn" id="d-show">${D.lesson ? 'Hint' : 'Show me'}</button>`;
  }
  if (def.kind === 'hatch') return `<span class="big">${p.d}</span><span style="flex:1">Tap every cell where ${p.d} goes right now.</span>${D.lesson ? '<button class="linkbtn" id="d-show">Hint</button>' : '<button class="linkbtn" id="d-skip">Skip</button>'}`;
  if (def.kind === 'cands') return `<span style="flex:1">Mark every digit the pulsing cell could still be, then check.</span>${D.lesson ? '<button class="linkbtn" id="d-show">Hint</button>' : ''}`;
  if (def.kind === 'sprint') return `<span class="big" style="width:auto;padding:0 12px">${D.score}</span><span style="flex:1">Correct digits so far. Wrong ones cost 3 s.</span>`;
  return '';
}

function renderDrill() {
  if (!D || (!D.pos && !D.view)) return;
  const def = D.def, p = D.view || D.pos, spec = blankSpec(), sel = D.view ? -1 : D.sel, blind = !!def.blind;
  const sv = sel >= 0 ? p.g[sel] : 0, show = D.view ? D.view.show : D.show, reading = !!D.view;
  for (let i = 0; i < 81; i++) {
    const s = spec[i], cls = [];
    s.v = p.g[i];
    if (!reading && D.placed.has(i)) cls.push('user');
    if (!blind && sel >= 0) {
      if (i !== sel && E.PEERSET[sel].has(i)) cls.push('peer');
      if (sv && p.g[i] === sv && i !== sel) cls.push('same');
    }
    if (!reading && def.kind === 'hatch' && !blind && p.g[i] === p.d) cls.push('same');
    if (i === sel) cls.push('sel');
    if (p.notes && !p.g[i]) s.notes = p.notes[i];
    if (!reading && def.kind === 'cands' && i === p.cell) {
      cls.push('target'); if (D.phase === 'answer') cls.push('pulse');
      if (D.phase === 'answer') s.notes = D.toggles;
      else { s.notes = D.toggles | p.truth; s.nok = D.toggles & p.truth; s.nx = D.toggles & ~p.truth; s.nkey = p.truth & ~D.toggles; }
    }
    if (show) {
      if (show.cls[i]) cls.push(show.cls[i]);
      if (show.notes && show.notes[i] !== undefined && !p.g[i]) s.notes = show.notes[i];
      if (show.key[i]) s.nkey = show.key[i];
      if (show.x[i]) s.nx = show.x[i];
      if (show.ok[i]) s.nok = show.ok[i];
      if (show.place && show.place[0] === i && !p.g[i]) { s.v = show.place[1]; s.notes = 0; cls.push('user', 'okbg'); }
    }
    s.cls = cls.join(' ');
  }
  dBoard.render(spec);
  $('#d-prompt').innerHTML = D.phase === 'load' ? '' : D.phase === 'read' ? `<span class="small">Page ${D.page + 1} of ${D.pages.length}</span>` : prompt();
  const sh = $('#d-show'); if (sh) sh.onclick = D.lesson ? lessonHint : drillShowMe;
  const sk = $('#d-skip'); if (sk) sk.onclick = () => { D.errors++; D.times.push(now() - D.posStart + 5000); D.k++; afterItem(); };
  $('#d-prog').style.width = D.lesson ? Math.round(((D.phase === 'read' ? D.page : D.pages.length) + D.k) / (D.pages.length + D.total) * 100) + '%'
    : D.total ? Math.round(D.k / D.total * 100) + '%' : Math.max(0, 100 - D.timeLeft / (def.seconds * 10)) + '%';
  // pad & actions
  const pad = $('#d-pad'), act = $('#d-act');
  const showPad = D.phase === 'answer' && def.kind !== 'hatch';
  pad.style.display = showPad ? '' : 'none';
  $$('button', pad).forEach(b => b.classList.toggle('on', def.kind === 'cands' && !!(D.toggles & E.BIT(+b.dataset.d))));
  pad.classList.toggle('notesmode', !!def.notes && def.kind === 'find');
  act.innerHTML = D.phase === 'answer' && def.kind === 'cands' ? '<button class="btn primary" id="d-check" style="height:46px">Check</button>' : '';
  const ck = $('#d-check'); if (ck) ck.onclick = candsCheck;
}

function drillTap(i) {
  if (!D || D.phase !== 'answer') return;
  const def = D.def, p = D.pos;
  if (def.kind === 'hatch') {
    if (p.g[i]) return;
    if (D.targets.has(i)) {
      p.g[i] = p.d; D.placed.add(i); dBoard.pop(i);
      D.targets = hatchTargets(p.g, p.d); D.hints = null; D.hintIdx = 0; D.show = null; if (D.lesson) hideDrillCoach();
      if (!D.targets.size) { D.times.push(now() - D.posStart); D.k++; D.phase = 'between'; renderDrill(); toast(`Round ${D.k}: ${secs(D.times[D.times.length - 1])}`, 1000); setTimeout(afterItem, 650); return; }
    } else {
      D.errors++; dBoard.flash(i);
      toast(p.sol[i] === p.d ? `${p.d} does go there, but it can\u2019t be proven yet` : `${p.d} can\u2019t go there`);
    }
    renderDrill(); return;
  }
  if (def.kind === 'cands') return;
  D.sel = i; renderDrill();
}

function drillDigit(d) {
  if (!D || D.phase !== 'answer') return;
  const def = D.def, p = D.pos, i = D.sel;
  if (def.kind === 'cands') { D.toggles ^= E.BIT(d); renderDrill(); return; }
  if (def.kind === 'hatch') return;
  if (i < 0) { toast('Tap a cell first'); return; }
  if (def.kind === 'sprint') {
    if (p.g[i]) return;
    if (p.sol[i] === d) {
      p.g[i] = d; D.placed.add(i); D.score++; dBoard.pop(i);
      if (p.g.every(v => v)) { D.phase = 'load'; renderDrill(); toast('Board cleared. Next one!', 900); setTimeout(() => loadNext(), 500); return; }
    } else { D.errors++; D.timeLeft -= 3000; dBoard.flash(i); }
    renderDrill(); return;
  }
  // find-the-move
  if (!def.notes) {
    if (p.g[i]) return;
    const hit = p.targets.find(s => s.p[0] === i && s.p[1] === d);
    if (hit) return findCorrect(hit);
    const st = E.makeState(p.g), other = allSinglesList(st).find(s => s.p[0] === i && s.p[1] === d);
    if (other) { toast(`Right digit, but that\u2019s a ${E.TECH[other.t].name}. Look for the other one.`, 2400); return; }
    D.errors++; D.tries++; dBoard.flash(i); toast(p.sol[i] === d ? 'Correct digit, but it isn\u2019t provable yet' : 'Not that one');
    return;
  }
  if (p.g[i]) return;
  if (!(p.notes[i] & E.BIT(d))) { toast(`${d} isn\u2019t a candidate in ${E.cellName(i)}`); return; }
  const hit = p.ans.find(s => s.e.some(([c, x]) => c === i && x === d));
  if (hit) return findCorrect(hit);
  // a valid elimination from another technique? tell the player, don't punish
  const st = { g: Int8Array.from(p.g), c: Uint16Array.from(p.notes) };
  for (const T of E.TECHS) {
    if (T.tier === 0) continue;
    const o = T.find(st, 30).find(s => s.e && s.e.some(([c, x]) => c === i && x === d));
    if (o) { toast(`True, by ${T.name}. This drill wants a different pattern.`, 2400); return; }
  }
  D.errors++; D.tries++; dBoard.flash(i);
  toast(p.sol[i] === d ? `${d} is actually the answer for ${E.cellName(i)}` : 'That candidate can\u2019t be removed by this pattern yet');
}

function stepShow(st) {
  const sh = SH(), units = (st.hl.units || []).flatMap(u => E.UNITS[u]);
  addCls(sh, units, 'hunit');
  const A = st.hl.colorA ? new Set(st.hl.colorA) : null, Bc = st.hl.colorB ? new Set(st.hl.colorB) : null;
  for (const c of st.hl.cells) sh.cls[c] = A && A.has(c) ? 'colA' : Bc && Bc.has(c) ? 'colB' : 'hcell';
  const dig = st.hl.digit ? E.BIT(st.hl.digit) : st.digits ? st.digits.reduce((m, d) => m | E.BIT(d), 0) : 0;
  if (dig) addKey(sh, st.hl.cells, dig);
  if (st.e) addX(sh, st.e);
  return sh;
}

function findCorrect(step, revealed) {
  const p = D.pos, t = now() - D.posStart + (revealed ? 10000 : 0);
  D.times.push(t); D.k++;
  if (revealed) D.errors++;
  if (step.p) { p.g[step.p[0]] = step.p[1]; D.placed.add(step.p[0]); dBoard.pop(step.p[0]); }
  D.sel = step.p ? step.p[0] : -1;
  D.show = stepShow(step);
  D.phase = 'feedback';
  renderDrill();
  const last = D.k >= D.total;
  const el = $('#d-coach');
  el.className = 'coach show ' + (revealed ? '' : 'good');
  el.innerHTML = `<h4>${revealed ? '<span class="dot"></span>' : ''}${esc(E.TECH[step.t].name)}${revealed || D.lesson ? '' : `, ${secs(t)}`}</h4><p>${D.lesson && !revealed ? 'Well spotted. ' : ''}${esc(E.describe(step))}</p>
    <div class="actions"><button class="btn primary" id="dc-next">${last ? 'See results' : 'Next position'}</button></div>`;
  $('#dc-next').onclick = afterItem;
}
function drillShowMe() {
  if (!D || D.phase !== 'answer') return;
  const p = D.pos;
  findCorrect(D.def.notes ? p.ans[0] : p.targets[0], true);
}
function hideDrillCoach() { $('#d-coach').className = 'coach'; $('#d-coach').innerHTML = ''; }

function candsCheck() {
  const p = D.pos, ok = D.toggles === p.truth, t = now() - D.posStart;
  D.times.push(t + (ok ? 0 : 5000)); D.k++;
  if (!ok) D.errors++;
  D.phase = 'feedback'; renderDrill();
  const miss = E.digitsOf(p.truth & ~D.toggles), extra = E.digitsOf(D.toggles & ~p.truth);
  const el = $('#d-coach');
  el.className = 'coach show ' + (ok ? 'good' : 'bad');
  el.innerHTML = `<h4>${ok ? 'Exactly right' : 'Not quite'}${D.lesson ? '' : ', ' + secs(t)}</h4><p>${ok ? `${E.cellName(p.cell)} can be ${E.digitsOf(p.truth).join(', ')}.`
    : `${E.cellName(p.cell)} can be ${E.digitsOf(p.truth).join(', ')}.${miss.length ? ` You missed ${miss.join(', ')}.` : ''}${extra.length ? ` ${extra.join(', ')} ${extra.length > 1 ? 'are' : 'is'} already used in its row, column or box.` : ''}`}</p>
    <div class="actions"><button class="btn primary" id="dc-next">${D.k >= D.total ? 'See results' : 'Next cell'}</button></div>`;
  $('#dc-next').onclick = afterItem;
}

function afterItem() {
  if (!D) return;
  hideDrillCoach(); D.show = null;
  if (D.k >= D.total) return finishDrill();
  loadNext();
}

function finishDrill() {
  if (D.lesson) return completeLesson();
  const d = D.def; D.alive = false;
  let stars, score, better, lines;
  if (d.kind === 'sprint') {
    score = D.score; better = (a, b) => a > b;
    stars = score >= d.par[0] ? 3 : score >= d.par[1] ? 2 : score > 0 ? 1 : 0;
    lines = [[score, 'Digits'], [D.errors, 'Wrong'], [d.par[0], 'Gold at']];
  } else {
    const avg = D.times.reduce((a, b) => a + b, 0) / D.times.length / 1000;
    score = avg; better = (a, b) => a < b;
    stars = avg <= d.par[0] ? 3 : avg <= d.par[1] ? 2 : 1;
    lines = [[avg.toFixed(1) + ' s', 'Average'], [D.errors, d.kind === 'cands' ? 'Wrong' : 'Misses'], [(Math.min(...D.times) / 1000).toFixed(1) + ' s', 'Fastest']];
  }
  const prev = drillBest(d.id), wasBest = !prev || better(score, prev.score);
  if (stars) recordDrill(d, stars, score, better);
  DB.dlog.push({ ts: Date.now(), id: d.id, s: score, st: stars }); trimLogs(); save();
  const el = sheet(`
    <h2>${esc(d.title)}</h2>
    <div class="row" style="margin-top:2px">${beltHTML(d.lv)}<span class="sub">${LVL[d.lv].name} training${wasBest && prev ? ', new personal best' : ''}</span></div>
    ${starsHTML(stars, 'bigstars')}
    <div class="statgrid">${lines.map(([v, l]) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`).join('')}</div>
    <p class="small">${esc(parLine(d))}</p>
    <button class="btn primary" id="dr-again">Go again</button>
    <button class="btn line" id="dr-back">Back to training</button>`, () => { if (current === 'drill') go('train'); });
  $('#dr-again', el).onclick = () => { sheet._onClose = null; closeSheet(); startDrill(d.id); };
  $('#dr-back', el).onclick = () => closeSheet();
}


/* =====================================================================
   LESSONS — learn every technique inside the app
   theory pages → a live walkthrough on a generated grid → guided practice
   ===================================================================== */
const cn = E.cellName, un = E.unitName, BIT = E.BIT;
const kindOf = u => u < 9 ? 'row' : u < 18 ? 'column' : 'box';
const listOf = a => a.length <= 1 ? a.join('') : a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
const WORD = { 1: 'one', 2: 'two', 3: 'three', 4: 'four' }, word = n => WORD[n] || String(n);
const maskOf = ds => ds.reduce((m, d) => m | BIT(d), 0);
function elimText(e) {
  const by = {};
  for (const [i, d] of e) (by[d] = by[d] || []).push(cn(i));
  return listOf(Object.keys(by).map(d => `${d} from ${listOf(by[d])}`));
}
function SH() { return { cls: {}, key: {}, x: {}, ok: {}, place: null, notes: null }; }
function addCls(sh, cells, c) { for (const i of cells) sh.cls[i] = sh.cls[i] ? sh.cls[i] + ' ' + c : c; }
function addKey(sh, cells, m) { for (const i of cells) sh.key[i] = (sh.key[i] || 0) | m; }
function addX(sh, e) { for (const [i, d] of e) sh.x[i] = (sh.x[i] || 0) | BIT(d); }
function cloneSh(sh) { return { cls: Object.assign({}, sh.cls), key: Object.assign({}, sh.key), x: Object.assign({}, sh.x), ok: Object.assign({}, sh.ok), place: sh.place, notes: sh.notes }; }

/* ---------- a step-by-step walkthrough of one concrete move ---------- */
function walkthrough(step, st) {
  const F = [], push = (p, sh) => F.push({ p: p.charAt(0).toUpperCase() + p.slice(1), show: cloneSh(sh) });
  const e = step.e || [], eCells = [...new Set(e.map(x => x[0]))];
  switch (step.t) {
    case 'fullHouse': {
      const [i, d] = step.p, U = E.UNITS[step.u];
      const have = U.filter(c => st.g[c]).map(c => st.g[c]).sort((a, b) => a - b);
      const s = SH(); addCls(s, U, 'hunit'); addCls(s, [i], 'target');
      push(`Look at ${un(step.u)}. Eight of its nine cells are already filled.`, s);
      push(`It already has ${listOf(have)}. A ${kindOf(step.u)} holds every digit once, so the missing one is ${d}.`, s);
      s.place = [i, d]; push(`${cn(i)} must be ${d}.`, s);
      break;
    }
    case 'hiddenSingleBox':
    case 'hiddenSingleLine': {
      const [i, d] = step.p, u = step.u, U = E.UNITS[u];
      const empt = U.filter(c => !st.g[c] && c !== i);
      const allD = []; for (let c = 0; c < 81; c++) if (st.g[c] === d) allD.push(c);
      const left = new Set(empt.filter(c => allD.some(b => E.sees(b, c))));
      const byElim = empt.filter(c => !left.has(c));
      const blocked = [...left], blockers = [], rays = new Set();
      while (left.size) {
        let best = -1, bn = 0;
        for (const b of allD) { let n = 0; for (const c of left) if (E.sees(b, c)) n++; if (n > bn) { bn = n; best = b; } }
        if (best < 0) break;
        blockers.push(best);
        for (const c of [...left]) if (E.sees(best, c)) {
          left.delete(c);
          const via = E.ROW[best] === E.ROW[c] ? E.ROW[best] : E.COL[best] === E.COL[c] ? 9 + E.COL[best] : 18 + E.BOX[best];
          for (const r of E.UNITS[via]) rays.add(r);
        }
      }
      const s = SH(); addCls(s, U, 'hunit');
      push(`Where can ${d} go in ${un(u)}? Every ${kindOf(u)} needs a ${d}, and this one has ${empt.length + 1} empty cells.`, s);
      const s2 = SH(); addCls(s2, [...rays].filter(c => !U.includes(c)), 'ray'); addCls(s2, U, 'hunit'); addCls(s2, blocked, 'xcell'); addCls(s2, blockers, 'hcell');
      push(`Each ${d} already on the grid rules out its whole row, column and box. ${blockers.length === 1 ? `The ${d} in ${cn(blockers[0])} rules out` : `The ${d}s in ${listOf(blockers.map(cn))} rule out`} ${blocked.length === 1 ? 'one of the empty cells' : `${blocked.length} of the empty cells`} (shaded red).${byElim.length ? ` ${listOf(byElim.map(cn))} ${byElim.length === 1 ? 'was' : 'were'} ruled out earlier by other techniques.` : ''}`, s2);
      addCls(s2, [i], 'target'); s2.place = [i, d];
      push(`Only ${cn(i)} is left in ${un(u)}, so ${d} goes there.`, s2);
      break;
    }
    case 'nakedSingle': {
      const [i, d] = step.p, P = E.PEERS[i], seen = {};
      for (const c of P) if (st.g[c] && !seen[st.g[c]]) seen[st.g[c]] = c;
      const ds = Object.keys(seen).map(Number).sort((a, b) => a - b);
      const s = SH(); addCls(s, P, 'hunit'); addCls(s, [i], 'target');
      push(`Look at ${cn(i)}. It sees 20 cells: the rest of its row, its column and its box (shaded).`, s);
      addCls(s, Object.values(seen), 'hcell');
      push(`Between them those cells already hold ${listOf(ds)}. A cell can\u2019t be a digit that any cell it sees already has.`, s);
      s.place = [i, d]; push(`That leaves only ${d}, so ${cn(i)} is ${d}.`, s);
      break;
    }
    case 'pointing':
    case 'claiming': {
      const d = step.d, cells = step.hl.cells;
      const A = step.t === 'pointing' ? step.u : step.u, Bu = step.t === 'pointing' ? step.line : step.box;
      const s = SH(); addCls(s, E.UNITS[A], 'hunit'); addCls(s, cells, 'hcell'); addKey(s, cells, BIT(d));
      push(`Look at digit ${d} in ${un(A)}. The notes show it can only go in ${listOf(cells.map(cn))}.`, s);
      addCls(s, E.UNITS[Bu].filter(c => !E.UNITS[A].includes(c)), 'ray');
      push(step.t === 'pointing'
        ? `All of them are in ${un(Bu)}. So wherever it ends up, ${un(A)}\u2019s ${d} sits in ${un(Bu)}.`
        : `All of them are inside ${un(Bu)}. So ${un(A)}\u2019s ${d} is somewhere in ${un(Bu)}.`, s);
      addX(s, e);
      push(step.t === 'pointing'
        ? `${un(Bu)} can only hold one ${d}, and ${un(A)} is using it. Remove ${d} from the rest of ${un(Bu)}: ${listOf(eCells.map(cn))}.`
        : `${un(Bu)} can only hold one ${d}, and ${un(A)} is using it. Remove ${d} from the box\u2019s other cells: ${listOf(eCells.map(cn))}.`, s);
      break;
    }
    case 'nakedPair':
    case 'nakedTriple': {
      const n = step.cells.length, m = maskOf(step.digits);
      const s = SH(); addCls(s, E.UNITS[step.u], 'hunit'); addCls(s, step.cells, 'hcell'); addKey(s, step.cells, m);
      push(n === 2 ? `Look at ${listOf(step.cells.map(cn))} in ${un(step.u)}. Both can only be ${step.digits.join(' or ')}.`
        : `Look at ${listOf(step.cells.map(cn))} in ${un(step.u)}. Between them, their candidates are only ${listOf(step.digits)}.`, s);
      push(`${word(n)} cells and ${word(n)} digits: those cells will use up ${listOf(step.digits)} between them, in some order. So no other cell in ${un(step.u)} can be any of those digits.`, s);
      addX(s, e); push(`Remove them: ${elimText(e)}.`, s);
      break;
    }
    case 'hiddenPair':
    case 'hiddenTriple': {
      const n = step.cells.length, m = maskOf(step.digits);
      const s = SH(); addCls(s, E.UNITS[step.u], 'hunit'); addCls(s, step.cells, 'hcell'); addKey(s, step.cells, m);
      push(`In ${un(step.u)}, where can ${listOf(step.digits)} go? Check the notes: only in ${listOf(step.cells.map(cn))}.`, s);
      push(`${word(n)} digits need ${word(n)} cells, and only these ${word(n)} cells can take them. So these cells must be ${listOf(step.digits)} and nothing else.`, s);
      addX(s, e); push(`Remove their other candidates: ${elimText(e)}.`, s);
      break;
    }
    case 'xWing':
    case 'swordfish': {
      const d = step.d, n = step.base.length, bk = step.byRow ? 'row' : 'column', ck = step.byRow ? 'column' : 'row';
      const baseU = step.base.map(a => step.byRow ? a : 9 + a), coverU = step.cover.map(k => step.byRow ? 9 + k : k);
      const baseN = step.base.map(a => `${bk} ${a + 1}`), coverN = step.cover.map(k => `${ck} ${k + 1}`);
      const baseL = `${bk}s ${listOf(step.base.map(a => a + 1))}`, coverL = `${ck}s ${listOf(step.cover.map(k => k + 1))}`;
      const s = SH(); for (const u of baseU) addCls(s, E.UNITS[u], 'hunit'); addCls(s, step.hl.cells, 'hcell'); addKey(s, step.hl.cells, BIT(d));
      push(`Follow digit ${d}. In ${baseL}, the notes show only ${n === 2 ? 'two' : 'two or three'} cells where ${d} can go.`, s);
      for (const u of coverU) addCls(s, E.UNITS[u].filter(c => !baseU.some(b => E.UNITS[b].includes(c))), 'ray');
      push(`All of those cells sit in just ${word(n)} ${ck}s: ${coverL}.`, s);
      push(n === 2
        ? `Each of the two ${bk}s needs a ${d}. They can\u2019t both use the same ${ck}, since a ${ck} holds one ${d}. So the ${d}s sit on opposite corners of this rectangle, and either way each ${ck} gets its ${d} from these ${bk}s.`
        : `Each of the three ${bk}s needs a ${d}, and they can only use these three ${ck}s, a different one each. So all three ${ck}s get their ${d} from these ${bk}s.`, s);
      addX(s, e); push(`No other cell in ${coverL} can be ${d}: remove ${d} from ${listOf(eCells.map(cn))}.`, s);
      break;
    }
    case 'xyWing': {
      const P = step.pivot, [W1, W2] = step.wings, z = step.z, cp = st.c[P];
      const a = E.LOW[cp & st.c[W1]], b = E.LOW[cp & st.c[W2]];
      const s = SH(); addCls(s, [P], 'hcell'); addKey(s, [P], cp);
      push(`The pivot, ${cn(P)}, has just two candidates: ${a} and ${b}.`, s);
      addCls(s, [W1, W2], 'hcell'); addKey(s, [W1, W2], st.c[W1] | st.c[W2]);
      push(`It sees ${cn(W1)}, which is ${a} or ${z}, and ${cn(W2)}, which is ${b} or ${z}. These are the wings.`, s);
      push(`If the pivot is ${a}, ${cn(W1)} can\u2019t be ${a}, so it\u2019s ${z}. If the pivot is ${b}, ${cn(W2)} is ${z}. Either way, one of the wings is ${z}.`, s);
      addCls(s, eCells, 'hunit'); addX(s, e);
      push(`So a cell that sees both wings can\u2019t be ${z}: remove ${z} from ${listOf(eCells.map(cn))}.`, s);
      break;
    }
    case 'xyzWing': {
      const P = step.pivot, [W1, W2] = step.wings, z = step.z, zb = BIT(z);
      const x = E.LOW[st.c[W1] & ~zb], y = E.LOW[st.c[W2] & ~zb];
      const s = SH(); addCls(s, [P], 'hcell'); addKey(s, [P], st.c[P]);
      push(`The pivot, ${cn(P)}, has three candidates: ${x}, ${y} and ${z}.`, s);
      addCls(s, [W1, W2], 'hcell'); addKey(s, [W1, W2], st.c[W1] | st.c[W2]);
      push(`It sees ${cn(W1)} (${x} or ${z}) and ${cn(W2)} (${y} or ${z}). All three cells have ${z}.`, s);
      push(`If the pivot is ${x}, ${cn(W1)} must be ${z}. If it\u2019s ${y}, ${cn(W2)} is ${z}. If it\u2019s ${z}, the pivot itself is ${z}. One of the three is always ${z}.`, s);
      addCls(s, eCells, 'hunit'); addX(s, e);
      push(`A cell that sees all three can\u2019t be ${z}: remove ${z} from ${listOf(eCells.map(cn))}.`, s);
      break;
    }
    case 'coloring': {
      const d = step.d, A = step.A, Bc = step.B, comp = A.concat(Bc);
      const s = SH(); addCls(s, comp, 'hcell'); addKey(s, comp, BIT(d));
      push(`Follow digit ${d}. When a row, column or box has only two cells where ${d} can go, exactly one of them is ${d}. That\u2019s a strong link. These cells are joined by a chain of strong links.`, s);
      const s2 = SH(); addCls(s2, A, 'colA'); addCls(s2, Bc, 'colB'); addKey(s2, comp, BIT(d));
      push(`Colour them alternately green and red along the links. Each link has exactly one ${d}, so either every green cell is ${d}, or every red one is.`, s2);
      if (step.rule === 'wrap') {
        const bad = A.includes(e[0][0]) ? 'green' : 'red';
        addX(s2, e); push(`Two ${bad} cells see each other, and they can\u2019t both be ${d}. So ${bad} is the false colour: remove ${d} from every ${bad} cell.`, s2);
      } else {
        addCls(s2, eCells, 'hunit'); addX(s2, e);
        push(`${listOf(eCells.map(cn))} ${eCells.length === 1 ? 'sees' : 'each see'} a green cell and a red cell. One of the colours is true, so one of those cells is ${d}: remove ${d} from ${listOf(eCells.map(cn))}.`, s2);
      }
      break;
    }
    case 'xyChain': {
      const ch = step.chain, x = step.x, ts = [];
      let prev = x;
      for (const c of ch) { const t = E.LOW[st.c[c] & ~BIT(prev)]; ts.push(t); prev = t; }
      const s = SH(); addCls(s, ch, 'hcell'); for (const c of ch) addKey(s, [c], st.c[c]);
      push(`These cells each have exactly two candidates, and each one sees the next: ${listOf(ch.map(cn))}.`, s);
      const parts = ch.slice(1).map((c, k) => `${cn(c)} must be ${ts[k + 1]}`);
      push(`Suppose ${cn(ch[0])} isn\u2019t ${x}. Then it\u2019s ${ts[0]}, so ${parts.length > 4 ? parts.slice(0, 2).join(', so ') + ', and so on down the chain, until ' + parts[parts.length - 1] : parts.join(', so ')}.`, s);
      addCls(s, eCells, 'hunit'); addX(s, e);
      push(`So if the first cell isn\u2019t ${x}, the last one is. One of the two ends is always ${x}. A cell that sees both ends can\u2019t be ${x}: remove ${x} from ${listOf(eCells.map(cn))}.`, s);
      break;
    }
  }
  return F;
}

const TECH_SRC = { fullHouse: 'easy', hiddenSingleBox: 'easy', hiddenSingleLine: 'medium', nakedSingle: 'medium' };

/* ---------- lesson pages for the intro lessons ---------- */

/* ---------- running a lesson ---------- */
function practiceDef(L) {
  if (L.practice === 'hatch') return { kind: 'hatch', src: 'easy', rounds: 2, title: L.title };
  if (L.practice === 'cands') return { kind: 'cands', src: 'medium', n: 2, title: L.title };
  if (L.tech && !L.practice) { const t = L.tech; return { kind: 'find', techs: [t], src: srcFor(t), notes: E.TECH[t].tier > 0, n: 2, title: L.title }; }
  return { kind: 'none', title: L.title };
}
async function startLesson(id, from) {
  const L = LESSONS[id];
  if (D) D.alive = false;
  const def = practiceDef(L);
  D = { lesson: id, from: from || null, def, rng: E.mulberry32(randSeed()), k: 0, total: def.kind === 'none' ? 0 : 2, times: [], errors: 0, score: 0,
    sel: -1, phase: 'load', alive: true, placed: new Set(), toggles: 0, next: null, page: 0, hintIdx: 0 };
  const me = D;
  go('drill');
  $('#d-title').textContent = L.title;
  hideDrillCoach(); $('#d-prompt').innerHTML = ''; $('#d-prog').style.width = '0%'; $('#d-clock').textContent = '';
  dBoard.render(blankSpec());
  const slow = setTimeout(() => loading(true, 'Preparing the lesson'), 150);
  await tick();
  let ctx = {};
  if (L.setup === 'rules' || L.setup === 'plain') {
    const P = E.generate(L.setup === 'rules' ? 'easy' : 'medium', (me.rng() * 4294967296) >>> 0);
    ctx.pos = { g: P.puzzle, sol: P.solution };
  } else if (L.setup === 'cands') {
    ctx.pos = await buildCands({ src: 'medium' }, me.rng);
  } else {
    const t = L.tech, fdef = { techs: [t], src: srcFor(t), notes: E.TECH[t].tier > 0 };
    ctx.pos = fdef.notes ? await buildFindElim(fdef, me.rng) : await buildFindSingles(fdef, me.rng);
    if (ctx.pos) {
      const step = fdef.notes ? ctx.pos.ans[0] : ctx.pos.targets[0];
      const st = { g: Int8Array.from(ctx.pos.g), c: fdef.notes ? Uint16Array.from(ctx.pos.notes) : E.makeState(ctx.pos.g).c };
      ctx.frames = walkthrough(step, st);
    }
  }
  clearTimeout(slow); loading(false);
  if (!me.alive || D !== me) return;
  if (!ctx.pos) { toast('Couldn\u2019t prepare the lesson. Try again.'); go('train'); return; }
  const pages = [];
  if (L.setup === 'rules') pages.push(...rulesPages(ctx));
  else if (L.setup === 'cands') pages.push(...candPages(ctx));
  else {
    const base = { g: ctx.pos.g, notes: ctx.pos.notes || null, show: SH() };
    for (const [h, p] of L.pages) pages.push([h, p, base]);
    if (ctx.frames) {
      pages.push(['An example', 'Here\u2019s one in a real grid. Tap Next to walk through it step by step.', base]);
      ctx.frames.forEach((f, k) => pages.push([`Example, step ${k + 1} of ${ctx.frames.length}`, f.p, { g: ctx.pos.g, notes: ctx.pos.notes || null, show: f.show }]));
    }
  }
  me.pages = pages.map(([h, p, v]) => ({ h, p, view: v }));
  me.phase = 'read';
  showPage(0);
}
function showPage(k) {
  const me = D; if (!me || !me.pages) return;
  me.page = k; me.phase = 'read';
  const pg = me.pages[k];
  me.view = pg.view;
  renderDrill();
  const last = k === me.pages.length - 1;
  const el = $('#d-coach');
  el.className = 'coach show lesson';
  el.innerHTML = `<h4>${esc(pg.h)}</h4><p>${esc(pg.p)}</p>
    <div class="actions">${k > 0 ? '<button class="btn line" id="lp-back">Back</button>' : ''}<button class="btn primary" id="lp-next">${last ? (me.total ? 'Your turn' : 'Finish') : 'Next'}</button></div>`;
  if (k > 0) $('#lp-back').onclick = () => showPage(k - 1);
  $('#lp-next').onclick = () => {
    if (!last) return showPage(k + 1);
    me.view = null; hideDrillCoach();
    if (me.total) { toast(me.def.kind === 'find' ? 'Now find one yourself. Stuck? Tap Hint.' : 'Your turn. Stuck? Tap Hint.', 2200); loadNext(true); }

}
function lessonHint() {
  if (!D || D.phase !== 'answer') return;
  const p = D.pos, def = D.def;
  if (!D.hints) {
    if (def.kind === 'find') {
      const step = def.notes ? p.ans[0] : p.targets[0];
      D.hints = walkthrough(step, { g: Int8Array.from(p.g), c: def.notes ? Uint16Array.from(p.notes) : E.makeState(p.g).c });
    } else if (def.kind === 'hatch') {
      const st = E.makeState(p.g), step = allSinglesList(st).find(s => s.p[1] === p.d && (s.t === 'hiddenSingleBox' || s.t === 'hiddenSingleLine')) || allSinglesList(st).find(s => s.p[1] === p.d);
      D.hints = step ? walkthrough(step, st) : [];
    } else if (def.kind === 'cands') {
      const i = p.cell, seen = {}; for (const c of E.PEERS[i]) if (p.g[c] && !seen[p.g[c]]) seen[p.g[c]] = c;
      const s1 = SH(); addCls(s1, E.PEERS[i], 'hunit'); addCls(s1, Object.values(seen), 'hcell');
      const s2 = cloneSh(s1); addKey(s2, [i], p.truth); s2.notes = { [i]: p.truth };
      D.hints = [{ p: `Check ${un(E.ROW[i])}, ${un(9 + E.COL[i])} and ${un(18 + E.BOX[i])}. Those cells already hold ${listOf(Object.keys(seen).map(Number).sort((a, b) => a - b))}, so cross those off.`, show: s1 },

}
function completeLesson() {

const LOG_CAP = 4000;

const dayKey = ts => todayKey(new Date(ts));

  const m = {};
  for (const e of DB.log) { const k = dayKey(e.ts); m[k] = (m[k] || 0) + 1; }
  for (const e of DB.dlog) { if (DRILL_BY_ID[e.id] && DRILL_BY_ID[e.id].kind === 'run') continue; const k = dayKey(e.ts); m[k] = (m[k] || 0) + 1; }
  return m;
}
function activeStreak(m) {
  let n = 0; const d = new Date();
  if (!m[todayKey(d)]) d.setDate(d.getDate() - 1);
  while (m[todayKey(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function heatmapHTML(m) {
  const WEEKS = 15, today = new Date(); today.setHours(0, 0, 0, 0);
  const start = new Date(today); start.setDate(start.getDate() - today.getDay() - 7 * (WEEKS - 1));
  let cells = '', active = 0;
  for (let k = 0; k < WEEKS * 7; k++) {
    const d = new Date(start); d.setDate(start.getDate() + k);
    if (d > today) { cells += '<i class="fut"></i>'; continue; }
    const n = m[todayKey(d)] || 0; if (n) active++;
    const lv = n === 0 ? 0 : n === 1 ? 1 : n <= 3 ? 2 : n <= 6 ? 3 : 4;
    cells += `<i class="h${lv}" title="${d.toLocaleDateString()}: ${n} session${n === 1 ? '' : 's'}"></i>`;
  }
  return { html: `<div class="heat" style="grid-template-columns:repeat(${WEEKS},1fr)">${cells}</div>`, active, weeks: WEEKS };
}

/* ---------- solve-time trend ---------- */
function trendSVG(list) {
  const W = 320, H = 150, L = 42, R = 8, T = 10, B = 16, n = list.length;
  const v = list.map(e => e.t / 1000), mx = Math.max(...v), mn = Math.min(...v), pad = Math.max(10, (mx - mn) * 0.15);
  const lo = Math.max(0, mn - pad), hi = mx + pad;
  const x = i => L + (W - L - R) * (n === 1 ? 0.5 : i / (n - 1));
  const y = s => T + (H - T - B) * (1 - (s - lo) / (hi - lo));
  let g = '';
  for (let k = 0; k <= 2; k++) {
    const s = lo + (hi - lo) * k / 2, yy = y(s).toFixed(1);
    g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" style="stroke:var(--line)" stroke-width="1"/>`;
    g += `<text x="${L - 6}" y="${(+yy + 4).toFixed(1)}" text-anchor="end" style="fill:var(--muted)" font-size="10">${fmt(s * 1000)}</text>`;
  }
  const clean = list.map((e, i) => e.c ? v[i] : Infinity);
  const best = Math.min(...clean);
  if (isFinite(best)) g += `<line x1="${L}" x2="${W - R}" y1="${y(best).toFixed(1)}" y2="${y(best).toFixed(1)}" style="stroke:var(--ok)" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  g += `<polyline fill="none" style="stroke:var(--pen)" stroke-opacity=".35" stroke-width="1.5" points="${v.map((s, i) => x(i).toFixed(1) + ',' + y(s).toFixed(1)).join(' ')}"/>`;
  if (n >= 3) {
    const avg = v.map((_, i) => { const a = v.slice(Math.max(0, i - 4), i + 1); return a.reduce((p, q) => p + q, 0) / a.length; });
    g += `<polyline fill="none" style="stroke:var(--star)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" points="${avg.map((s, i) => x(i).toFixed(1) + ',' + y(s).toFixed(1)).join(' ')}"/>`;
  }
  g += list.map((e, i) => `<circle cx="${x(i).toFixed(1)}" cy="${y(v[i]).toFixed(1)}" r="3.5" style="fill:${e.c ? 'var(--pen)' : 'var(--surface)'};stroke:var(--pen)" stroke-width="1.5"><title>${relDay(e.ts)}: ${fmt(e.t)}${e.c ? '' : ' (assisted)'}</title></circle>`).join('');
  g += `<text x="${L}" y="${H - 2}" style="fill:var(--muted)" font-size="10">${relDay(list[0].ts)}</text><text x="${W - R}" y="${H - 2}" text-anchor="end" style="fill:var(--muted)" font-size="10">${relDay(list[n - 1].ts)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" class="trend" role="img" aria-label="Solve times">${g}</svg>`;
}
function trendSummary(list) {
  if (list.length < 6) return '';
  const k = Math.min(5, Math.floor(list.length / 2));
  const avg = a => a.reduce((p, e) => p + e.t, 0) / a.length;
  const a = avg(list.slice(-k)), b = avg(list.slice(-2 * k, -k)), d = b - a;
  if (Math.abs(d) < 1000) return `Last ${k} average ${fmt(a)}, about the same as the ${k} before.`;
  return `Last ${k} average ${fmt(a)}: ${fmt(Math.abs(d))} ${d > 0 ? 'faster' : 'slower'} than the ${k} before.`;
}

/* ---------- weak spots, from the stall analysis of recent solves ---------- */
const SCAN_DRILL = { easy: 'easy-hatch', medium: 'med-hatch', hard: 'med-hatch', expert: 'med-sprint', master: 'med-sprint', extreme: 'ext-blind' };
function weakSpots() {
  const recent = DB.log.slice(-30), c = {};
  for (const e of recent) for (const w of (e.w || [])) c[w] = (c[w] || 0) + 1;
  return { n: recent.length, list: Object.keys(c).sort((a, b) => c[b] - c[a]).slice(0, 4).map(k => ({ k, n: c[k] })) };
}
function weakLabel(k) {
  return { scan: 'Scanning pauses', trial: 'Spots needing trial and error', mistake: 'A wrong digit on the board', notes: 'Writing notes',
    hiddenSingleLine: 'Hidden Singles in rows and columns', nakedSingle: 'Naked Singles' }[k] || (E.TECH[k] ? E.TECH[k].name : k);
}
function weakNote(k) {
  return {
    scan: 'An easy single (a Full House or a single in a box) was there; it just took a while to spot.',
    trial: 'Beyond the techniques the app teaches.',
    mistake: 'A wrong digit stops anything else from adding up. Check before you commit a digit.',
    notes: 'Long stretches spent pencil-marking. Faster, accurate notes save a lot of time.',
    hiddenSingleLine: 'The only easy move was a single in a row or column, which is harder to see than one in a box.',
    nakedSingle: 'The only move was a cell with one possible digit, which you find by counting rather than scanning.',
  }[k] || 'Nothing easier was left; this technique was the way through.';
}
function weakDrill(k) {
  if (k === 'scan') return SCAN_DRILL[S.lastLevel] || 'med-hatch';
  if (k === 'notes') return ['easy', 'medium'].includes(S.lastLevel) ? 'med-cands' : 'hard-cands';
  return DRILL_FOR_TECH[k] || null;
}
function weakLesson(k) { return k === 'scan' ? 'hatch' : k === 'notes' ? 'candidates' : LESSONS[k] ? k : null; }

function drillScore(d, s) { return d.kind === 'sprint' ? `${s} digits` : d.kind === 'run' ? fmt(s * 1000) : `${s.toFixed(1)} s avg`; }

/* ---------- PROGRESS tab ---------- */
function renderMe() {
  const body = $('#me-body'), mode = renderMe.mode || 'paper';
  if (!renderMe.level) {
    const cnt = {}; for (const e of DB.log) cnt[e.l] = (cnt[e.l] || 0) + 1;
    renderMe.level = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a])[0] || S.lastLevel || 'medium';
  }
  const lv = renderMe.level;
  const act = activity(), hm = heatmapHTML(act), streak = activeStreak(act);
  const totalStars = LEVEL_IDS.reduce((a, l) => a + levelStars(l), 0), maxStars = LEVEL_IDS.reduce((a, l) => a + DRILLS[l].length * 3, 0);
  const solves = DB.log.filter(e => e.l === lv && e.m === mode), shown = solves.slice(-30);
  const st = DB.stats[lv + '|' + mode] || {};
  const weak = weakSpots();
  const recentDrills = DB.dlog.filter(e => DRILL_BY_ID[e.id]).slice(-5).reverse();
  const rows = LEVEL_IDS.map(l => {
    const s = DB.stats[l + '|' + mode] || {};
    return `<tr><td>${beltHTML(l)}${LVL[l].name}</td><td>${s.solved || 0}</td><td>${s.best ? fmt(s.best) : '\u2013'}</td><td>${s.solved ? fmt(s.total / s.solved) : '\u2013'}</td></tr>`;
  }).join('');

  body.innerHTML = `
    <div class="statgrid" style="margin-top:6px">
      <div class="stat"><b>${streak}</b><span>Day streak</span></div>
      <div class="stat"><b>${DB.log.length}</b><span>Solves logged</span></div>
      <div class="stat"><b>${totalStars}<small style="font-size:13px;color:var(--muted)">/${maxStars}</small></b><span>Stars</span></div>
    </div>

    <div class="card" style="margin-top:4px">
      <h3>Activity</h3>
      <div class="sub">${hm.active ? `Active on ${hm.active} day${hm.active === 1 ? '' : 's'} in the last ${hm.weeks} weeks` : 'Each solve or drill fills in a day'}</div>
      ${hm.html}
      <div class="heat-legend"><span>${hm.weeks} weeks ago</span><span class="sw-row">Less <i class="h0"></i><i class="h1"></i><i class="h2"></i><i class="h3"></i><i class="h4"></i> More</span></div>
    </div>

    <div class="card">
      <h3>Solve times</h3>
      <div class="beltbar" id="me-level" style="margin-top:8px">${LEVEL_IDS.map(id => `<button data-l="${id}" class="${id === lv ? 'on' : ''}">${beltHTML(id)}${LVL[id].name}</button>`).join('')}</div>
      <div class="seg" id="me-mode"><button data-m="paper" class="${mode === 'paper' ? 'on' : ''}">Paper</button><button data-m="classic" class="${mode === 'classic' ? 'on' : ''}">Classic</button></div>
      ${shown.length >= 2 ? `
        ${trendSVG(shown)}
        <div class="legend"><span><i style="background:var(--pen)"></i>Solve</span><span><i style="background:var(--star)"></i>5-solve average</span><span><i class="dash"></i>Best</span><span>Lower is faster</span></div>
        <p class="sub" style="margin:8px 0 0">${esc(trendSummary(shown)) || `Best ${st.best ? fmt(st.best) : '\u2013'}, average ${st.solved ? fmt(st.total / st.solved) : '\u2013'}.`}</p>`
      : `<p class="sub" style="margin:14px 0 4px">${shown.length === 1 ? `One ${LVL[lv].name} solve so far (${fmt(shown[0].t)}). One more and your trend appears here.` : `Solve two ${LVL[lv].name} puzzles in ${mode} mode to see your trend.`}</p>`}
    </div>

    <div class="card">
      <h3>Where you get stuck</h3>
      ${weak.list.length ? `<div class="sub">From the pauses in your last ${weak.n} solve${weak.n === 1 ? '' : 's'}</div>` + weak.list.map(w => {
        return `<div class="weak"><div style="flex:1"><b>${esc(weakLabel(w.k))}</b><span class="small">${w.n} long pause${w.n === 1 ? '' : 's'}. ${esc(weakNote(w.k))}</span>${focusButtons(w.k)}</div></div>`;
      }).join('') : `<p class="sub" style="margin:4px 0 0">${DB.log.length ? 'No long pauses in your recent solves. Nice and steady.' : 'After each solve, the app checks your longest pauses and why they happened. The patterns collect here.'}</p>`}
    </div>

    <div class="card">
      <h3>Training</h3>
      ${LEVEL_IDS.map(l => `<div class="row" style="margin-top:10px">${beltHTML(l)}<span style="width:68px;font-size:14px">${LVL[l].name}</span><div class="bar" style="flex:1;margin:0"><i style="width:${Math.round(levelStars(l) / (DRILLS[l].length * 3) * 100)}%"></i></div><span class="small" style="width:40px;text-align:right">${levelStars(l)}/${DRILLS[l].length * 3}</span></div>`).join('')}
      ${recentDrills.length ? `<div class="sub" style="margin-top:16px">Recent drills</div>` + recentDrills.map(e => {
        const d = DRILL_BY_ID[e.id];
        return `<button class="drill" data-drill="${e.id}" style="padding:10px 0"><span class="meta"><b style="font-size:15px">${esc(d.title)}</b><span>${LVL[d.lv].name}, ${relDay(e.ts)}, ${drillScore(d, e.s)}</span></span>${starsHTML(e.st)}</button>`;
      }).join('') : ''}
    </div>

    <div class="card">
      <h3>Personal bests</h3>
      <table class="table" style="margin-top:6px"><tr><th>Level</th><th>Solved</th><th>Best</th><th>Average</th></tr>${rows}</table>
      <p class="small" style="margin-bottom:0">${mode === 'paper' ? 'Paper' : 'Classic'} mode. Best times only count solves without hints or revealed mistakes.</p>
    </div>

    <div class="card">
      <h3>Backup</h3>
      <p class="sub" style="margin:4px 0 0">Your progress is stored on this device only. Save a backup to move it to another phone or browser, or to keep it safe.${DB.ui.lastBackup ? ` Last backup: ${relDay(DB.ui.lastBackup).toLowerCase()}.` : ''}</p>
      <div class="row" style="margin-top:12px"><button class="btn ghost" id="me-export" style="margin:0">Save backup</button><button class="btn line" id="me-import" style="margin:0">Restore</button></div>
    </div>

    <div class="card">
      <h3>Support Sudoku Dojo</h3>
      <p class="sub" style="margin:4px 0 0">Free, no ads, no tracking. If it\u2019s made you faster, you can chip in to keep it that way.</p>
      <button class="btn primary" id="me-support" style="margin-top:14px">Support the app</button>
    </div>
    <div class="card">
      <h3>How puzzles are made</h3>
      <p class="sub" style="margin:4px 0 0">No grids are stored. Each one is built on your phone from a seed: a binary model with 729 variables and 324 constraints fills a random solution, removes clues while checking the answer stays unique, and a logic solver that knows ${E.TECHS.length} techniques grades it to the level you picked.</p>
    </div>
    <button class="btn line" id="me-settings" style="margin-top:14px">Settings</button>`;

  centerOn($('#me-level'));
  $('#me-level').onclick = e => { const b = e.target.closest('button'); if (b) { renderMe.level = b.dataset.l; renderMe(); } };
  $('#me-mode').onclick = e => { const b = e.target.closest('button'); if (b) { renderMe.mode = b.dataset.m; renderMe(); } };
  body.onclick = e => {
    const l = e.target.closest('[data-lesson]'); if (l) return startLesson(l.dataset.lesson);
    const b = e.target.closest('[data-drill]'); if (b) { S.trainLevel = DRILL_BY_ID[b.dataset.drill].lv; save(); openDrillIntro(b.dataset.drill); }
  };
  $('#me-export').onclick = exportProgress;
  $('#me-import').onclick = importProgress;
  $('#me-support').onclick = supportSheet;
  $('#me-settings').onclick = settingsSheet;
}

function centerOn(bar) {
  const on = bar && $('.on', bar); if (!on) return;
  bar.scrollLeft = Math.max(0, on.offsetLeft - bar.offsetLeft - (bar.clientWidth - on.clientWidth) / 2);
}

/* ---------- backup / restore ---------- */
async function exportProgress() {
  DB.ui.lastBackup = Date.now(); save();
  const data = JSON.stringify({ app: 'sudoku-dojo', version: 1, exported: new Date().toISOString(), data: DB });
  const name = `sudoku-dojo-backup-${todayKey()}.json`;
  let file = null;
  try { file = new File([data], name, { type: 'application/json' }); } catch (e) { /* very old browsers */ }
  try {
    if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Sudoku Dojo backup' });
      toast('Backup saved'); renderMe(); return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const url = URL.createObjectURL(file || new Blob([data], { type: 'application/json' }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  toast('Backup saved'); renderMe();
}
function importProgress() {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'application/json,.json';
  inp.onchange = async () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    let obj = null;
    try { obj = JSON.parse(await f.text()); } catch (e) { /* handled below */ }
    if (!obj || obj.app !== 'sudoku-dojo' || !obj.data || typeof obj.data !== 'object') { toast('That file isn\u2019t a Sudoku Dojo backup'); return; }
    const src = obj.data, n = (src.log || []).length;
    const stars = Object.values(src.drills || {}).reduce((a, d) => a + (d.stars || 0), 0);
    const el = sheet(`<h2>Restore this backup?</h2>
      <p>Saved ${relDay(Date.parse(obj.exported) || Date.now()).toLowerCase()}, with ${n} solve${n === 1 ? '' : 's'} and ${stars} star${stars === 1 ? '' : 's'}.</p>
      <p class="sub">It replaces all progress on this device, including any game in progress.</p>
      <button class="btn primary" id="ip-go">Replace and restore</button><button class="btn line" id="ip-no">Cancel</button>`);
    $('#ip-no', el).onclick = closeSheet;
    $('#ip-go', el).onclick = () => {
      for (const k in DEF) if (k !== 'settings') DB[k] = src[k] !== undefined ? src[k] : JSON.parse(JSON.stringify(DEF[k]));
      for (const k of Object.keys(S)) delete S[k];
      Object.assign(S, DEF.settings, src.settings || {});
      DB.ui = Object.assign({ installDismissed: false, lastBackup: 0 }, DB.ui);
      save(); applyTheme(); closeSheet(); toast('Progress restored'); renderMe();
    };
  };
  inp.click();
}

/* ---------- install prompt & offline (only on the hosted version) ---------- */
const HOSTED = !!document.querySelector('link[rel="manifest"]');
const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const STANDALONE = navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; if (current === 'play') renderPlay(); });

function installCardHTML() {
  if (!HOSTED || STANDALONE || DB.ui.installDismissed) return '';
  if (IS_IOS) return `<div class="card install" id="inst"><button class="iconbtn x" id="inst-x" aria-label="Dismiss">\u00d7</button>
      <h3>Install on your iPhone</h3>
      <p class="sub" style="margin:4px 0 0">In Safari, tap <b>Share</b> <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="vertical-align:-3px"><path d="M12 3v12M8 7l4-4 4 4"/><path d="M5 12v7a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-7"/></svg> then <b>Add to Home Screen</b>. It opens full screen, works offline, and Safari won\u2019t clear your progress.</p></div>`;
  if (deferredInstall) return `<div class="card install" id="inst"><button class="iconbtn x" id="inst-x" aria-label="Dismiss">\u00d7</button>
      <h3>Install the app</h3><p class="sub" style="margin:4px 0 0">Full screen, works offline, keeps your progress.</p>
      <button class="btn primary" id="inst-go" style="margin-top:12px">Install</button></div>`;
  return '';
}
function wireInstallCard() {
  const x = $('#inst-x'); if (x) x.onclick = () => { DB.ui.installDismissed = true; save(); $('#inst').remove(); };
  const g = $('#inst-go'); if (g) g.onclick = async () => { deferredInstall.prompt(); await deferredInstall.userChoice.catch(() => {}); deferredInstall = null; renderPlay(); };
}

/* ---------------- boot ---------------- */
applyTheme();
go('play');
sizeBoards();
if (HOSTED) {
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}

</script>
</body>
